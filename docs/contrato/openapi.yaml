          description: |
            Reserva do guest criada; tokenGuest aparece só aqui. A API continua devolvendo o campo `tokenGuest` neste corpo;
            o BFF do Next grava o token num cookie HttpOnly e tira o campo antes de responder ao navegador (D150).
          headers:
