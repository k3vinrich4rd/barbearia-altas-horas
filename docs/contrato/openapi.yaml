                  value: {"id": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "CONFIRMADO", "origem": "GUEST", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60}, "barbeiro": {"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido"}, "inicio": "2026-11-24T10:00:00-03:00", "fim": "2026-11-24T11:00:00-03:00", "precoCentavos": 4500, "expiraEm": null, "motivoCancelamento": null, "version": 2}
        '404': { $ref: '#/components/responses/Erro404' }
  /agendamentos/{id}/prorrogacao:
    post:
      tags: [agenda]
      operationId: prorrogarPagamento
      summary: Acrescenta 2 minutos ao prazo do Pix, até 10 vezes por reserva (1.12.0, ADR 0015; antes 1 minuto uma vez, D188)
      description: |
        Do dono da reserva (`sub` do token). **Sem corpo** (qualquer campo é `400 CAMPO_DESCONHECIDO`).
        **1.12.0 (ADR 0015, revoga a D190 e altera a D188):** cada pedido soma `prorrogacao.segundos` (120 s, propriedade
        `app.agenda.prorrogacao-pagamento`) ao prazo que está correndo, até `prorrogacao.maximo` (10, propriedade
        `app.agenda.prorrogacao-maximo`) pedidos por reserva (WCAG 2.2.1, "Extend": pelo menos 10). A janela continua o
        **último minuto** do prazo, `[expiraEm - 60 s, expiraEm)`, e só com a reserva `AGUARDANDO_PAGAMENTO`; depois de
        somar, o prazo volta a ter mais de 60 s, então a janela fecha até o próximo último minuto.
        `X-Idempotency-Key` (UUID, **opcional**, o mesmo cabeçalho da cobrança): repetir o **último** pedido com a mesma chave devolve `200` com o mesmo corpo,
        **sem** somar nem contar. Sem a chave, uma repetição logo depois de somar cai fora da janela (`422
        PRORROGACAO_FORA_DA_JANELA`) e também não soma. Ordem das checagens: `404` (não é dono, não existe, é reserva
        manual) → `422 TRANSICAO_INVALIDA` (status final) → `200` (mesma `X-Idempotency-Key` do último pedido, prazo vivo) →
        `422 RESERVA_EXPIRADA` (prazo vencido, sem carência e sem reabertura) → `422 PRORROGACAO_ESGOTADA` (já usou os
        `maximo` pedidos; o 11º) → `422 PRORROGACAO_FORA_DA_JANELA` (antes do último minuto) → grava (`201`).
        O Pix já gerado **não muda** (o mesmo copia e cola); a cobrança nasce no gateway com validade do prazo máximo possível
        (ADR 0015) e `cobranca.expira_em` acompanha o `expiraEm` da reserva (D191). Resposta com Cache-Control no-store.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKeyProrrogacao'
      responses:
        '200':
          description: Repetição do último pedido com a mesma `X-Idempotency-Key`; o mesmo corpo, nada somado nem contado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '201':
          description: Prorrogada; `expiraEm` ganhou `prorrogacao.segundos` (120 s) e `prorrogacao.usadas` subiu 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409Agendamento' }
        '422': { $ref: '#/components/responses/Erro422' }
  /agendamentos/guest/{id}/prorrogacao:
    post:
      tags: [guest]
      operationId: prorrogarPagamentoDoGuest
      summary: O visitante acrescenta 2 minutos ao prazo do Pix, até 10 vezes (1.12.0, ADR 0015)
      description: |
        As mesmas regras de `POST /agendamentos/{id}/prorrogacao` (120 s por pedido, até 10, `X-Idempotency-Key` opcional,
        `422 PRORROGACAO_ESGOTADA` no 11º), com o `X-Guest-Token` da reserva no lugar do bearer.
        Token errado, ausente ou de outra reserva: o mesmo `404` de "não existe" (R23). Rota pública só para `POST`.
      security: [ { guestToken: [] } ]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKeyProrrogacao'
      responses:
        '200':
          description: Repetição do último pedido com a mesma `X-Idempotency-Key`; o mesmo corpo, nada somado nem contado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '201':
          description: Prorrogada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409Agendamento' }
        '422': { $ref: '#/components/responses/Erro422' }
  /agendamentos/guest/{id}/regiao:
    delete:
      tags: [guest]
      operationId: retirarRegiaoDoGuest
      summary: O visitante retira a autorização de região da reserva (1.9.0, LGPD art. 8º, § 5º)
      description: |
        Com o `X-Guest-Token` da própria reserva. Apaga a região da reserva **na hora**; a reserva em si não muda. Idempotente:
        retirar de novo também é `204`. Token errado, ausente ou de outra reserva: o mesmo `404` de "não existe" (R23), com o mesmo
        corpo. Limite de 30 pedidos por minuto por IP (`429`).
      security: [ { guestToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Região apagada }
        '404': { $ref: '#/components/responses/Erro404' }
        '429': { $ref: '#/components/responses/Erro429' }
  /pagamentos/cobrancas:
    post:
      tags: [pagamento]
      operationId: criarCobranca
      summary: Cria a cobrança de 100% do serviço por Pix ou cartão de crédito (CPF pedido só aqui)
      description: |
        Cliente logado usa o bearer; guest usa o cabeçalho X-Guest-Token como alternativa ao bearer (sem nenhum
        dos dois: 401). Pix devolve QR Code e copia e cola;
        cartão devolve a URL do checkout do gateway (os dados do cartão nunca passam pela API).
        Exige `aceitePolitica: true`; sem ele, 422 ACEITE_POLITICA_OBRIGATORIO.
      security: [ { bearer: [] }, { guestToken: [] } ]
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobrancaRequest' }
      responses:
        '201':
          description: Cobrança criada (único lugar com cpfMascarado, montado do CPF recebido; o CPF não é guardado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CobrancaCriada' }
              examples:
                pixSimulado:
                  summary: "Pix no modo simulado do beta: copia e cola sem QR em base64 (o front gera o QR)"
                  value: {"id": "898173a0-e09e-4e71-942b-74e08c6d121b", "reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "PENDENTE", "metodo": "PIX", "valorCentavos": 4500, "pix": {"copiaECola": "SIMULADO-898173a0-e09e-4e71-942b-74e08c6d121b", "qrCodeBase64": null, "expiraEm": "2026-11-20T11:25:07-03:00"}, "cartao": null, "cpfMascarado": "***.***.***-25"}
        '200':
          description: Repetição com a mesma chave e o mesmo corpo (sem cpfMascarado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cobranca' }
              examples:
                repeticao:
                  summary: "Mesma chave e mesmo corpo: devolve a mesma cobrança, sem cpfMascarado"
                  value: {"id": "898173a0-e09e-4e71-942b-74e08c6d121b", "reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "PENDENTE", "metodo": "PIX", "valorCentavos": 4500, "pix": {"copiaECola": "SIMULADO-898173a0-e09e-4e71-942b-74e08c6d121b", "qrCodeBase64": null, "expiraEm": "2026-11-20T11:25:07-03:00"}, "cartao": null}
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Reserva' }
        '409':
          description: |
            COBRANCA_EM_ANDAMENTO: a reserva já tem uma cobrança PENDENTE (ou PAGA) com outra chave de idempotência;
            o `detail` traz o id da existente. Só uma cobrança viva por reserva.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              examples:
                cobrancaEmAndamento:
                  summary: "Segunda cobrança para a mesma reserva, com outra chave de idempotência"
                  value: {"detail": "Esta reserva já tem uma cobrança em andamento: 898173a0-e09e-4e71-942b-74e08c6d121b.", "instance": "/pagamentos/cobrancas", "status": 409, "title": "Cobrança em andamento", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cobranca_em_andamento", "code": "COBRANCA_EM_ANDAMENTO", "traceId": "9b3e51d7a04c4f2e8d6a1c0b7e5f3a29", "errors": []}
        '422': { $ref: '#/components/responses/Erro422' }
        '429': { $ref: '#/components/responses/Erro429' }
        '503': { $ref: '#/components/responses/Erro503' }
  /pagamentos/simulacao/{cobrancaId}/confirmar:
    post:
      tags: [pagamento]
      operationId: confirmarPagamentoSimulado
      summary: Confirma o pagamento de uma cobrança no modo simulado (só no beta, D59)
      description: |
        Só existe com `app.pagamento.modo=simulado` (o padrão do beta); no modo `asaas` a rota não existe e responde 404.
        Faz o que o gateway faria: marca a cobrança como paga no GatewaySimulado e passa pelo MESMO caminho do webhook
        (evento gravado, gateway reconsultado, reserva CONFIRMADO). Só o dono da reserva (bearer ou X-Guest-Token);
        outro usuário recebe 404. Repetir é inofensivo.
      security: [ { bearer: [] }, { guestToken: [] } ]
      parameters:
