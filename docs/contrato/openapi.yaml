# Contrato de máquina da API da Barbearia Altas Horas (OpenAPI 3.1), escrito à mão antes do código (contrato primeiro).
# O acordo humano é o contrato-api.md; o front gera o cliente tipado daqui (npm run gerar:tipos).
# Lint: npx @redocly/cli@2.78.0 lint docs/contrato/openapi.yaml (0 erros e 0 avisos; exceções justificadas em .redocly.lint-ignore.yaml).
# Exemplos: respostas reais da API no perfil dev (20/11/2026), só com dados fictícios (e-mails @exemplo.test, CPF de teste).
openapi: 3.1.0
info:
  title: Barbearia Altas Horas API
  version: 1.12.0
  summary: Agendamento online da Barbearia Altas Horas (beta de portfólio)
  description: |
    API da agenda online da Barbearia Altas Horas (Jardim Bonança, Osasco, desde 1997).
    No ar em https://altas-horas-api.onrender.com (plano grátis: a primeira chamada depois de um tempo
    parado pode levar de 30 a 60 segundos, enquanto o servidor acorda). O site usa a API pelo BFF do Next.js.

    Convenções:
    - Erros no padrão RFC 9457 (`application/problem+json`) com as extensões `code` (estável, para o front
      decidir o que mostrar), `traceId` (para achar o pedido no log) e `errors[]` (campo e motivo).
    - Dinheiro em centavos (inteiro): `precoCentavos: 4500` = R$ 45,00.
    - Data e hora em ISO-8601 com offset (`2026-11-24T10:00:00-03:00`), no fuso `America/Sao_Paulo`.
    - Campos desconhecidos no corpo são recusados (`400 CAMPO_DESCONHECIDO`).

    Como testar o fluxo principal em 4 chamadas: `GET /servicos` → `GET /disponibilidade` →
    `POST /agendamentos/guest` → `POST /pagamentos/cobrancas` (e, no beta, `POST /pagamentos/simulacao/{cobrancaId}/confirmar`).
    Os exemplos de cada resposta vieram de uma execução real no perfil `dev`.

    Política de pagamento (R6 a R8, R18): todo agendamento, de cliente logado ou de
    guest, nasce `AGUARDANDO_PAGAMENTO`, trava o horário por 3 minutos e só vira
    `CONFIRMADO` pelo webhook do gateway com 100% do valor pago (Pix ou cartão de
    crédito). Antes de pagar, o cliente aceita que não há cancelamento, remarcação
    nem estorno por desistência ou falta (`aceitePolitica: true`). Não existe rota
    de cancelamento ou remarcação para o cliente.

    Exceção (1.6.0, Fatia 6D): a barbearia pode travar pelo painel um horário combinado por
    WhatsApp, fora do app (`POST /admin/agendamentos`). Essa reserva nasce `CONFIRMADO`, com
    origem `MANUAL`, sem cobrança e sem pagamento no sistema.

    Versão 1.9.0 (Fatia 11, ADR 0014): a região do cliente (bairro, município, UF) só existe com a **caixinha de consentimento**
    (`autorizaRegiao`) e o CEP nunca é guardado (`endereco.cep` fica `deprecated` e sempre nulo). O alcance conta **pessoas
    diferentes** (não atendimentos) com k = 5, sobe de nível (bairro, município, região imediata do IBGE, UF, "Outros estados")
    em vez de sumir, e a vitrine pública mostra só **faixas de porcentagem**, nunca número. O painel ganha o seletor de nível
    (`nivel`), a UF e o período. Só acréscimos e `deprecated`: nenhuma remoção (exceção documentada: `AlcancePainel.semRegiao`
    passou de número a objeto; o painel foi atualizado junto).
  license:
    name: Uso de portfólio (todos os direitos reservados)
    url: https://github.com/k3vinrich4rd/barbearia-altas-horas#-autor
servers:
  - url: https://altas-horas-api.onrender.com
    description: beta publicado (Render, plano grátis; pagamento simulado)
  - url: http://localhost:8080
    description: local, perfil dev (docker compose + ./mvnw spring-boot:run)
tags:
  - name: catalogo
    description: "Serviços e barbeiros ativos. Rotas públicas, sem login."
  - name: agenda
    description: "Horários livres e reserva de quem tem conta."
  - name: cep
    description: "Endereço pelo CEP (ViaCEP com reserva na BrasilAPI e cache). Nunca impede o cadastro nem a reserva."
  - name: conta
    description: "Cadastro, login, sessão (JWT curto e refresh rotativo) e troca de senha."
  - name: guest
    description: "Reserva sem conta (visitante): o acesso à reserva é pelo X-Guest-Token, mostrado uma única vez."
  - name: pagamento
    description: "Cobrança de 100% do serviço por Pix ou cartão, idempotente; no beta o gateway é simulado."
  - name: privacidade
    description: "LGPD: consentimentos de marketing e de região, política de privacidade, exportar e excluir os próprios dados."
  - name: alcance
    description: "De onde vêm os clientes (pessoas diferentes), por estado, região, município e bairro; nenhum lugar com menos de 5 aparece com número, ele sobe de nível."
  - name: admin
    description: "Painel do barbeiro e do administrador: agenda do dia, reserva manual, cadastros, pagamentos e auditoria."
security:
  - bearer: []
paths:
  /servicos:
    get:
      tags: [catalogo]
      operationId: listarServicos
      summary: Serviços ativos com duração e preço
      security: []
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Servico' }
              examples:
                catalogoDev:
                  summary: "Catálogo do perfil dev (os 5 serviços, todos com 60 min)"
                  value: [{"id": "6f1c2a8e-0000-4000-8000-000000000005", "nome": "Acabamento (Pezinho) / Sobrancelha", "duracaoMin": 60, "precoCentavos": 2000, "precoFormatado": "R$ 20,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000004", "nome": "Barba Completa / Desenhada", "duracaoMin": 60, "precoCentavos": 3000, "precoFormatado": "R$ 30,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60, "precoCentavos": 4500, "precoFormatado": "R$ 45,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000002", "nome": "Corte Degradê / Fade / Navalhado", "duracaoMin": 60, "precoCentavos": 5500, "precoFormatado": "R$ 55,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000003", "nome": "Corte Moderno / Visagismo (Tesoura)", "duracaoMin": 60, "precoCentavos": 6000, "precoFormatado": "R$ 60,00"}]
  /barbeiros:
    get:
      tags: [catalogo]
      operationId: listarBarbeiros
      summary: Barbeiros ativos, com o WhatsApp comercial
      description: |
        Cada item traz `whatsapp` (só dígitos, com DDD e DDI opcional) ou `null` quando o barbeiro não cadastrou número;
        o front monta `https://wa.me/<whatsapp>` e esconde o botão quando é nulo. É contato comercial divulgado pelo
        próprio barbeiro (D122), não dado de cliente.
      security: []
      responses:
        '200':
          description: Lista de barbeiros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BarbeiroPublico' }
              examples:
                semWhatsapp:
                  summary: "Barbeiro sem WhatsApp cadastrado: o front esconde o botão"
                  value: [{"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido", "whatsapp": null}]
  /disponibilidade:
    get:
      tags: [agenda]
      operationId: consultarDisponibilidade
      summary: Horários livres de um dia
      description: |
        Jornada menos folgas e reservas que ocupam horário (CONFIRMADO, ou AGUARDANDO_PAGAMENTO ainda no prazo),
        em passos de granularidadeMin, **depois de agora** (1.11.0, D197: não há antecedência mínima nem limite de dias à
        frente). `data` anterior a hoje, no fuso da barbearia: `422 ANTECEDENCIA_INSUFICIENTE` ("o horário já passou");
        qualquer data de hoje em diante é aceita. Serviço inativo: 422 SERVICO_INATIVO. Serviço ou barbeiro
        inexistente (ou barbeiro inativo): 404. Resposta com Cache-Control no-store.
        Desde a 1.12.0 (ADR 0015) cada barbeiro traz também o `expediente` do dia, para a tela mostrar "fechado" em vez de
        "sem horário": `aberto: false` com `motivoFechado` `FORA_DO_EXPEDIENTE` (a jornada não tem intervalo neste dia da
        semana) ou `FECHADO` (folga ou férias cobrem o expediente inteiro do dia). O tipo (`FOLGA` ou `FERIAS`) e o `motivo`
        da folga **nunca** saem aqui: só no `/admin`. Folga que cobre só parte do dia não aparece: o dia continua `aberto` e
        só os horários somem.
      security: []
      parameters:
        - { name: servicoId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: data, in: query, required: true, schema: { type: string, format: date }, example: '2026-12-01' }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Disponibilidade do dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidade' }
              examples:
                tercaLivre:
                  summary: "Terça livre (trecho: os 4 primeiros horários de início, a cada 30 min)"
                  value: {"data": "2026-11-24", "fuso": "America/Sao_Paulo", "servicoId": "6f1c2a8e-0000-4000-8000-000000000001", "duracaoMin": 60, "barbeiros": [{"barbeiroId": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido", "horarios": ["2026-11-24T07:00:00-03:00", "2026-11-24T07:30:00-03:00", "2026-11-24T08:00:00-03:00", "2026-11-24T08:30:00-03:00"]}]}
                tercaComExpediente:
                  summary: "1.12.0: terça aberta, com o expediente e o almoço (trecho dos horários; exemplo ilustrativo)"
                  value: {"data": "2026-12-01", "fuso": "America/Sao_Paulo", "servicoId": "6f1c2a8e-0000-4000-8000-000000000001", "duracaoMin": 60, "barbeiros": [{"barbeiroId": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido", "horarios": ["2026-12-01T07:00:00-03:00", "2026-12-01T07:30:00-03:00"], "expediente": {"aberto": true, "motivoFechado": null, "inicio": "2026-12-01T07:00:00-03:00", "fim": "2026-12-01T20:00:00-03:00", "almoco": {"inicio": "2026-12-01T12:00:00-03:00", "fim": "2026-12-01T13:00:00-03:00"}}}]}
                segundaFechada:
                  summary: "1.12.0: segunda, fora do expediente (exemplo ilustrativo)"
                  value: {"data": "2026-12-07", "fuso": "America/Sao_Paulo", "servicoId": "6f1c2a8e-0000-4000-8000-000000000001", "duracaoMin": 60, "barbeiros": [{"barbeiroId": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido", "horarios": [], "expediente": {"aberto": false, "motivoFechado": "FORA_DO_EXPEDIENTE", "inicio": null, "fim": null, "almoco": null}}]}
                diaDeFerias:
                  summary: "1.12.0: terça dentro das férias: o público vê só FECHADO, sem o tipo (exemplo ilustrativo)"
                  value: {"data": "2026-12-22", "fuso": "America/Sao_Paulo", "servicoId": "6f1c2a8e-0000-4000-8000-000000000001", "duracaoMin": 60, "barbeiros": [{"barbeiroId": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido", "horarios": [], "expediente": {"aberto": false, "motivoFechado": "FECHADO", "inicio": null, "fim": null, "almoco": null}}]}
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404Servico' }
        '422': { $ref: '#/components/responses/Erro422' }
  /cep/{cep}:
    get:
      tags: [cep]
      operationId: buscarCep
      summary: Endereço pelo CEP (ViaCEP com fallback BrasilAPI e cache)
      description: |
        Rota pública (sem token). Aceita `01001000` ou `01001-000`; qualquer outro formato é `400 CEP_INVALIDO`
        antes de qualquer chamada externa. Tenta o ViaCEP e, se ele falhar (timeout, erro de rede, 5xx, 429 ou
        resposta inválida), a BrasilAPI. Se o ViaCEP diz que o CEP não existe, a resposta é `404` sem consultar a
        BrasilAPI. Os dois fora: `503 CEP_INDISPONIVEL` (o cadastro não usa esta rota para decidir, R31).
        Encontrados ficam 7 dias em cache e inexistentes 1 hora (`fonte: CACHE`); falha de provedor nunca fica em cache.
        Limite de 30 consultas por minuto por IP (H21): passou, `429` com `Retry-After`.
      security: []
      parameters:
        - { name: cep, in: path, required: true, schema: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$' }, example: '01001000' }
      responses:
        '200':
          description: Endereço encontrado (`fonte` diz de onde veio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
        '429': { $ref: '#/components/responses/Erro429' }
        '503': { $ref: '#/components/responses/Erro503' }
  /auth/cadastro:
    post:
      tags: [conta]
      operationId: cadastrar
      summary: Cria conta de cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroRequest' }
      responses:
        '201':
          description: Conta criada
          headers:
            Location: { schema: { type: string }, example: /me }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/Erro400' }
        '409': { $ref: '#/components/responses/Erro409' }
        '429': { $ref: '#/components/responses/Erro429' }
  /auth/convite:
    post:
      tags: [conta]
      operationId: aceitarConvite
      summary: O barbeiro aceita o convite e cria o próprio login (Fatia 10B)
      description: |
        Pública, com limite de 10 pedidos por hora por IP (`429` com `Retry-After`). O dono gera o convite em
        `POST /admin/barbeiros/{id}/convite` e entrega o link `/convite#<codigo>` por WhatsApp ou em pessoa; o barbeiro abre a
        página (abrir **não** consome: o código vai no fragmento da URL, que nem o servidor nem a prévia de link recebem),
        digita o **próprio e-mail** e cria a senha.

        Ordem das checagens: (1) a forma do corpo, sem tocar no banco (`400`; a senha segue a regra do cadastro, de 10 a
        72 **bytes** em UTF-8); (2) o limite por IP; (3) a busca pelo SHA-256 do código, com o relógio. Tudo o que não é um aceite
        certo é **o mesmo** `422 CONVITE_INVALIDO`, com o mesmo corpo, título e mensagem: código inexistente, vencido, usado,
        revogado, e-mail de conta de equipe ou de conta desativada, ou conta que já existe sem estar logada. A conta nova nasce
        com o papel BARBEIRO e fica ligada ao barbeiro do convite.

        **Conta que já existe (H32).** Se o e-mail é de um cliente, o aceite só vale com o token **dessa** conta
        (`Authorization: Bearer`), sem `senha`: o convite soma o papel BARBEIRO e nunca define nem troca a senha. Mandar `senha`
        nesse caso é `400 CAMPO_DESCONHECIDO`. Mandar o e-mail de um cliente sem a conta logada é o `422` genérico e soma uma
        tentativa. Depois de 5 tentativas com o código certo (`app.conta.convite.tentativas-max`) o convite é revogado.
      security: [ {}, { bearer: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConviteAceiteRequest' }
      responses:
        '204':
          description: Convite aceito; entre com o e-mail e a senha novos
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
        '400': { $ref: '#/components/responses/Erro400' }
        '422': { $ref: '#/components/responses/Erro422' }
        '429': { $ref: '#/components/responses/Erro429' }
  /auth/login:
    post:
      tags: [conta]
      operationId: login
      summary: Login de cliente, barbeiro ou admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens emitidos (o refresh é guardado pelo BFF em cookie HttpOnly)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '429': { $ref: '#/components/responses/Erro429' }
  /auth/refresh:
    post:
      tags: [conta]
      operationId: renovarSessao
      summary: Troca o refresh (uso único, rotativo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Erro401' }
  /auth/logout:
    post:
      tags: [conta]
      operationId: logout
      summary: Encerra a família do refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sessão encerrada }
        '400': { $ref: '#/components/responses/Erro400' }
  /me:
    get:
      tags: [conta]
      operationId: meuPerfil
      summary: Meu perfil
      description: |
        `endereco.cep` é `deprecated` e sempre nulo desde a 1.9.0 (o CEP não é guardado); `regiaoAutorizada` diz se a conta
        autoriza o uso de bairro e cidade no alcance. Sem região, `endereco` não aparece.
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/Erro401' }
    put:
      tags: [conta]
      operationId: atualizarMinhaRegiao
      summary: Autoriza ou retira o uso da minha região (1.9.0)
      description: |
        Com `autorizaRegiao = true`, o CEP e a `versaoTextoRegiao` vigente (a de `GET /politica-privacidade`): consulta o CEP,
        grava bairro, cidade, UF e o município do IBGE e registra o consentimento `REGIAO_ALCANCE`. **O CEP não é guardado.**
        Sem `autorizaRegiao = true`, ou sem CEP, é **revogação**: a localidade do perfil e a região de todas as reservas da conta
        são apagadas e a conta sai do alcance; a linha de revogação fica no histórico. Versão diferente da vigente: `400
        VALIDACAO_INVALIDA` em `versaoTextoRegiao`. CEP inexistente ou provedor fora **nunca** derrubam a chamada (R31).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarPerfilRequest' }
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
    delete:
      tags: [privacidade]
      operationId: excluirConta
      summary: Excluir minha conta (LGPD)
      description: |
        Só `CLIENTE` (BARBEIRO e ADMIN: `403 ACESSO_NEGADO`). Não pede a senha no beta (D-3). Numa única transação:
        a conta é anonimizada (nome, e-mail, WhatsApp, senha e endereço saem, e o e-mail fica livre para um novo
        cadastro), as sessões e os refresh tokens deixam de valer e as reservas futuras ainda não pagas são canceladas.
        Com uma reserva futura **paga** (`CONFIRMADO`) a exclusão é recusada com `409 EXCLUSAO_BLOQUEADA_POR_RESERVA`
        e nada muda: o titular combina o cancelamento com a barbearia e exclui depois. Depois do `204`, o login e o
        token antigo dão `401`.
      responses:
        '204': { description: Conta anonimizada }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /me/senha:
    put:
      tags: [conta]
      operationId: trocarSenha
      summary: Troca a própria senha (encerra as outras sessões)
      description: |
        Confere a senha atual, grava a nova, incrementa a versão da credencial e revoga todos os refresh do
        usuário. É também como o admin sai da senha inicial (deveTrocarSenha).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrocaDeSenhaRequest' }
      responses:
        '204': { description: Senha trocada }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
  /me/dados:
    get:
      tags: [privacidade]
      operationId: exportarDados
      summary: Exportar meus dados (LGPD)
      description: |
        Conta, histórico completo de consentimentos e as reservas em que a conta é o cliente. Nunca sai hash de senha,
        refresh token, token de visitante, IP nem dado de outra pessoa. Resposta com `Cache-Control: no-store`.
        Limite de 5 exportações por hora por conta (H22): passou, `429` com `Retry-After`.
      responses:
        '200':
          description: Exportação em JSON
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportacaoDados' }
        '401': { $ref: '#/components/responses/Erro401' }
        '429': { $ref: '#/components/responses/Erro429' }
  /me/consentimentos:
    get:
      tags: [privacidade]
      operationId: meusConsentimentos
      summary: Meus consentimentos
      description: |
        O estado atual por finalidade (a linha mais recente de cada uma). Conta sem nenhum consentimento registrado
        (o admin inicial) recebe lista vazia. O histórico completo sai só em `GET /me/dados`.
      responses:
        '200':
          description: Estado atual de cada finalidade
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
        '401': { $ref: '#/components/responses/Erro401' }
  /me/consentimentos/marketing:
    put:
      tags: [privacidade]
      operationId: registrarConsentimentoMarketing
      summary: Aceita ou revoga o consentimento de marketing
      description: |
        `versaoTexto` precisa ser a vigente (a de `GET /politica-privacidade`); outra versão é `400 VALIDACAO_INVALIDA`
        com `errors[].field = versaoTexto` e nada é gravado. Pedir o estado que já vale, na mesma versão, devolve a
        linha existente sem gravar outra. Cada mudança de estado é uma linha nova (R28); revogar não apaga CEP,
        bairro nem cidade da conta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentimentoRequest' }
      responses:
        '200':
          description: Consentimento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
  /me/consentimentos/regiao:
    put:
      tags: [privacidade]
      operationId: registrarConsentimentoRegiao
      summary: Aceita ou revoga o consentimento de região (1.9.0)
      description: |
        No molde do de marketing (finalidade `REGIAO_ALCANCE`). `versaoTexto` precisa ser a vigente (`400 VALIDACAO_INVALIDA`).
        **Revogar apaga** a localidade do perfil e a região de todas as reservas da conta (ela passa a "sem região" no alcance).
        Cada mudança de estado é uma linha nova (R28). Aceitar por aqui só registra o aceite: a localidade vem de `PUT /me`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentimentoRequest' }
      responses:
        '200':
          description: Consentimento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
