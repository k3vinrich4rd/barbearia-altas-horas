                  value: {"id": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "AGUARDANDO_PAGAMENTO", "origem": "GUEST", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60}, "barbeiro": {"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Eduardo Candido"}, "inicio": "2026-11-24T10:00:00-03:00", "fim": "2026-11-24T11:00:00-03:00", "precoCentavos": 4500, "expiraEm": "2026-11-20T11:25:07-03:00", "motivoCancelamento": null, "version": 0, "tokenGuest": "g1_<token-mostrado-uma-única-vez>"}
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404Servico' }
