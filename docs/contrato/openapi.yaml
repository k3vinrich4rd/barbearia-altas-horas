# Contrato de máquina da API da Barbearia Altas Horas (OpenAPI 3.1), escrito à mão antes do código (contrato primeiro).
# O acordo humano é o contrato-api.md; o front gera o cliente tipado daqui (npm run gerar:tipos).
# Lint: npx @redocly/cli@2.78.0 lint docs/contrato/openapi.yaml (0 erros e 0 avisos; exceções justificadas em .redocly.lint-ignore.yaml).
# Exemplos: respostas reais da API no perfil dev (20/11/2026), só com dados fictícios (e-mails @exemplo.test, CPF de teste).
openapi: 3.1.0
info:
  title: Barbearia Altas Horas API
  version: 1.7.1
  summary: Agendamento online da Barbearia Altas Horas (beta de portfólio)
  description: |
    API da agenda online da Barbearia Altas Horas (Jardim Bonança, Osasco, desde 1997).
    No ar em https://altas-horas-api.onrender.com (plano grátis: a primeira chamada depois de um tempo
    parado pode levar de 30 a 60 segundos, enquanto o servidor acorda). O site usa a API pelo BFF do Next.js.

    Convenções:
    - Erros no padrão RFC 9457 (`application/problem+json`) com as extensões `code` (estável, para o front
      decidir o que mostrar), `traceId` (para achar o pedido no log) e `errors[]` (campo e motivo).
    - Dinheiro em centavos (inteiro): `precoCentavos: 4500` = R$ 45,00.
    - Data e hora em ISO-8601 com offset (`2026-11-24T10:00:00-03:00`), no fuso `America/Sao_Paulo`.
    - Campos desconhecidos no corpo são recusados (`400 CAMPO_DESCONHECIDO`).

    Como testar o fluxo principal em 4 chamadas: `GET /servicos` → `GET /disponibilidade` →
    `POST /agendamentos/guest` → `POST /pagamentos/cobrancas` (e, no beta, `POST /pagamentos/simulacao/{cobrancaId}/confirmar`).
    Os exemplos de cada resposta vieram de uma execução real no perfil `dev`.

    Política de pagamento (R6 a R8, R18): todo agendamento, de cliente logado ou de
    guest, nasce `AGUARDANDO_PAGAMENTO`, trava o horário por 3 minutos e só vira
    `CONFIRMADO` pelo webhook do gateway com 100% do valor pago (Pix ou cartão de
    crédito). Antes de pagar, o cliente aceita que não há cancelamento, remarcação
    nem estorno por desistência ou falta (`aceitePolitica: true`). Não existe rota
    de cancelamento ou remarcação para o cliente.

    Exceção (1.6.0, Fatia 6D): a barbearia pode travar pelo painel um horário combinado por
    WhatsApp, fora do app (`POST /admin/agendamentos`). Essa reserva nasce `CONFIRMADO`, com
    origem `MANUAL`, sem cobrança e sem pagamento no sistema.
  license:
    name: Uso de portfólio (todos os direitos reservados)
    url: https://github.com/k3vinrich4rd/barbearia-altas-horas#-autor
servers:
  - url: https://altas-horas-api.onrender.com
    description: beta publicado (Render, plano grátis; pagamento simulado)
  - url: http://localhost:8080
    description: local, perfil dev (docker compose + ./mvnw spring-boot:run)
tags:
  - name: catalogo
    description: "Serviços e barbeiros ativos. Rotas públicas, sem login."
  - name: agenda
    description: "Horários livres e reserva de quem tem conta."
  - name: cep
    description: "Endereço pelo CEP (ViaCEP com reserva na BrasilAPI e cache). Nunca impede o cadastro nem a reserva."
  - name: conta
    description: "Cadastro, login, sessão (JWT curto e refresh rotativo) e troca de senha."
  - name: guest
    description: "Reserva sem conta (visitante): o acesso à reserva é pelo X-Guest-Token, mostrado uma única vez."
  - name: pagamento
    description: "Cobrança de 100% do serviço por Pix ou cartão, idempotente; no beta o gateway é simulado."
  - name: privacidade
    description: "LGPD: consentimento de marketing, política de privacidade, exportar e excluir os próprios dados."
  - name: alcance
    description: "De onde vêm os clientes, por cidade e bairro, sempre agrupado (nenhum grupo com menos de 5)."
  - name: admin
    description: "Painel do barbeiro e do administrador: agenda do dia, reserva manual, cadastros, pagamentos e auditoria."
security:
  - bearer: []
paths:
  /servicos:
    get:
      tags: [catalogo]
      operationId: listarServicos
      summary: Serviços ativos com duração e preço
      security: []
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Servico' }
              examples:
                catalogoDev:
                  summary: "Catálogo do perfil dev (os 5 serviços, todos com 60 min)"
                  value: [{"id": "6f1c2a8e-0000-4000-8000-000000000005", "nome": "Acabamento (Pezinho) / Sobrancelha", "duracaoMin": 60, "precoCentavos": 2000, "precoFormatado": "R$ 20,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000004", "nome": "Barba Completa / Desenhada", "duracaoMin": 60, "precoCentavos": 3000, "precoFormatado": "R$ 30,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60, "precoCentavos": 4500, "precoFormatado": "R$ 45,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000002", "nome": "Corte Degradê / Fade / Navalhado", "duracaoMin": 60, "precoCentavos": 5500, "precoFormatado": "R$ 55,00"}, {"id": "6f1c2a8e-0000-4000-8000-000000000003", "nome": "Corte Moderno / Visagismo (Tesoura)", "duracaoMin": 60, "precoCentavos": 6000, "precoFormatado": "R$ 60,00"}]
  /barbeiros:
    get:
      tags: [catalogo]
      operationId: listarBarbeiros
      summary: Barbeiros ativos, com o WhatsApp comercial
      description: |
        Cada item traz `whatsapp` (só dígitos, com DDD e DDI opcional) ou `null` quando o barbeiro não cadastrou número;
        o front monta `https://wa.me/<whatsapp>` e esconde o botão quando é nulo. É contato comercial divulgado pelo
        próprio barbeiro (D122), não dado de cliente.
      security: []
      responses:
        '200':
          description: Lista de barbeiros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BarbeiroPublico' }
              examples:
                semWhatsapp:
                  summary: "Barbeiro sem WhatsApp cadastrado: o front esconde o botão"
                  value: [{"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Carlos Eduardo Cândido", "whatsapp": null}]
  /disponibilidade:
    get:
      tags: [agenda]
      operationId: consultarDisponibilidade
      summary: Horários livres de um dia
      description: |
        Jornada menos folgas e reservas que ocupam horário (CONFIRMADO, ou AGUARDANDO_PAGAMENTO ainda no prazo),
        em passos de granularidadeMin, a partir de agora + antecedenciaMinimaMin. `data` antes de hoje ou além
        do horizonte: 422 FORA_DO_HORIZONTE. Serviço inativo: 422 SERVICO_INATIVO. Serviço ou barbeiro
        inexistente (ou barbeiro inativo): 404. Resposta com Cache-Control no-store.
      security: []
      parameters:
        - { name: servicoId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: data, in: query, required: true, schema: { type: string, format: date }, example: '2026-12-01' }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Disponibilidade do dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidade' }
              examples:
                tercaLivre:
                  summary: "Terça livre (trecho: os 4 primeiros horários de início, a cada 30 min)"
                  value: {"data": "2026-11-24", "fuso": "America/Sao_Paulo", "servicoId": "6f1c2a8e-0000-4000-8000-000000000001", "duracaoMin": 60, "barbeiros": [{"barbeiroId": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Carlos Eduardo Cândido", "horarios": ["2026-11-24T07:00:00-03:00", "2026-11-24T07:30:00-03:00", "2026-11-24T08:00:00-03:00", "2026-11-24T08:30:00-03:00"]}]}
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404Servico' }
        '422': { $ref: '#/components/responses/Erro422' }
  /cep/{cep}:
    get:
      tags: [cep]
      operationId: buscarCep
      summary: Endereço pelo CEP (ViaCEP com fallback BrasilAPI e cache)
      description: |
        Rota pública (sem token). Aceita `01001000` ou `01001-000`; qualquer outro formato é `400 CEP_INVALIDO`
        antes de qualquer chamada externa. Tenta o ViaCEP e, se ele falhar (timeout, erro de rede, 5xx, 429 ou
        resposta inválida), a BrasilAPI. Se o ViaCEP diz que o CEP não existe, a resposta é `404` sem consultar a
        BrasilAPI. Os dois fora: `503 CEP_INDISPONIVEL` (o cadastro não usa esta rota para decidir, R31).
        Encontrados ficam 7 dias em cache e inexistentes 1 hora (`fonte: CACHE`); falha de provedor nunca fica em cache.
        Limite de 30 consultas por minuto por IP (H21): passou, `429` com `Retry-After`.
      security: []
      parameters:
        - { name: cep, in: path, required: true, schema: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$' }, example: '01001000' }
      responses:
        '200':
          description: Endereço encontrado (`fonte` diz de onde veio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Endereco' }
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404' }
        '429': { $ref: '#/components/responses/Erro429' }
        '503': { $ref: '#/components/responses/Erro503' }
  /auth/cadastro:
    post:
      tags: [conta]
      operationId: cadastrar
      summary: Cria conta de cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroRequest' }
      responses:
        '201':
          description: Conta criada
          headers:
            Location: { schema: { type: string }, example: /me }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '400': { $ref: '#/components/responses/Erro400' }
        '409': { $ref: '#/components/responses/Erro409' }
        '429': { $ref: '#/components/responses/Erro429' }
  /auth/login:
    post:
      tags: [conta]
      operationId: login
      summary: Login de cliente, barbeiro ou admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Tokens emitidos (o refresh é guardado pelo BFF em cookie HttpOnly)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '429': { $ref: '#/components/responses/Erro429' }
  /auth/refresh:
    post:
      tags: [conta]
      operationId: renovarSessao
      summary: Troca o refresh (uso único, rotativo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Novo par de tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { $ref: '#/components/responses/Erro401' }
  /auth/logout:
    post:
      tags: [conta]
      operationId: logout
      summary: Encerra a família do refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Sessão encerrada }
        '400': { $ref: '#/components/responses/Erro400' }
  /me:
    get:
      tags: [conta]
      operationId: meuPerfil
      summary: Meu perfil
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Perfil' }
        '401': { $ref: '#/components/responses/Erro401' }
    delete:
      tags: [privacidade]
      operationId: excluirConta
      summary: Excluir minha conta (LGPD)
      description: |
        Só `CLIENTE` (BARBEIRO e ADMIN: `403 ACESSO_NEGADO`). Não pede a senha no beta (D-3). Numa única transação:
        a conta é anonimizada (nome, e-mail, WhatsApp, senha e endereço saem, e o e-mail fica livre para um novo
        cadastro), as sessões e os refresh tokens deixam de valer e as reservas futuras ainda não pagas são canceladas.
        Com uma reserva futura **paga** (`CONFIRMADO`) a exclusão é recusada com `409 EXCLUSAO_BLOQUEADA_POR_RESERVA`
        e nada muda: o titular combina o cancelamento com a barbearia e exclui depois. Depois do `204`, o login e o
        token antigo dão `401`.
      responses:
        '204': { description: Conta anonimizada }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /me/senha:
    put:
      tags: [conta]
      operationId: trocarSenha
      summary: Troca a própria senha (encerra as outras sessões)
      description: |
        Confere a senha atual, grava a nova, incrementa a versão da credencial e revoga todos os refresh do
        usuário. É também como o admin sai da senha inicial (deveTrocarSenha).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrocaDeSenhaRequest' }
      responses:
        '204': { description: Senha trocada }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
  /me/dados:
    get:
      tags: [privacidade]
      operationId: exportarDados
      summary: Exportar meus dados (LGPD)
      description: |
        Conta, histórico completo de consentimentos e as reservas em que a conta é o cliente. Nunca sai hash de senha,
        refresh token, token de visitante, IP nem dado de outra pessoa. Resposta com `Cache-Control: no-store`.
        Limite de 5 exportações por hora por conta (H22): passou, `429` com `Retry-After`.
      responses:
        '200':
          description: Exportação em JSON
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportacaoDados' }
        '401': { $ref: '#/components/responses/Erro401' }
        '429': { $ref: '#/components/responses/Erro429' }
  /me/consentimentos:
    get:
      tags: [privacidade]
      operationId: meusConsentimentos
      summary: Meus consentimentos
      description: |
        O estado atual por finalidade (a linha mais recente de cada uma). Conta sem nenhum consentimento registrado
        (o admin inicial) recebe lista vazia. O histórico completo sai só em `GET /me/dados`.
      responses:
        '200':
          description: Estado atual de cada finalidade
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consentimento' }
        '401': { $ref: '#/components/responses/Erro401' }
  /me/consentimentos/marketing:
    put:
      tags: [privacidade]
      operationId: registrarConsentimentoMarketing
      summary: Aceita ou revoga o consentimento de marketing
      description: |
        `versaoTexto` precisa ser a vigente (a de `GET /politica-privacidade`); outra versão é `400 VALIDACAO_INVALIDA`
        com `errors[].field = versaoTexto` e nada é gravado. Pedir o estado que já vale, na mesma versão, devolve a
        linha existente sem gravar outra. Cada mudança de estado é uma linha nova (R28); revogar não apaga CEP,
        bairro nem cidade da conta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentimentoRequest' }
      responses:
        '200':
          description: Consentimento registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consentimento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
  /politica-pagamento:
    get:
      tags: [catalogo]
      operationId: politicaPagamento
      summary: Texto e versão da política de pagamento exibidos antes do checkout
      security: []
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoliticaPagamento' }
              examples:
                versaoAtual:
                  summary: "Texto exibido no checkbox do checkout"
                  value: {"versao": 1, "texto": "Após o pagamento antecipado de 100%, não há cancelamento, remarcação ou estorno em caso de desistência ou falta."}
  /politica-privacidade:
    get:
      tags: [privacidade]
      operationId: politicaPrivacidade
      summary: Política de privacidade e texto da caixa de marketing, com a versão vigente
      description: |
        Rota pública. A `versao` devolvida é a mesma que `PUT /me/consentimentos/marketing` exige. Texto novo = versão
        nova, e a anterior continua guardada (a prova do consentimento precisa do texto que a pessoa viu).
      security: []
      responses:
        '200':
          description: Política vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoliticaPrivacidade' }
  /alcance:
    get:
      tags: [alcance]
      operationId: alcancePublico
      summary: Cidades e bairros que a barbearia atende (só nomes, sem números)
      description: |
        Rota pública (sem token), vitrine para quem vai agendar (E35). Cobre os atendimentos (`CONFIRMADO` e `CONCLUIDO`)
        dos últimos 12 meses e lista só as cidades e os bairros com 5 ou mais atendimentos no recorte (k-anonimato, ADR 0009),
        ordenados por volume, **sem contagens**. Nada de "Outras cidades" nem "Outros bairros" aqui. O resultado fica em cache
        no servidor por 1 hora (`atualizadoEm` diz quando foi calculado). Limite de 30 consultas por minuto por IP: passou,
        `429` com `Retry-After`.
      security: []
      responses:
        '200':
          description: Regiões atendidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlcancePublico' }
        '429': { $ref: '#/components/responses/Erro429' }
  /agendamentos:
    post:
      tags: [agenda]
      operationId: agendarComoCliente
      summary: Reserva como cliente logado (nasce AGUARDANDO_PAGAMENTO, trava o horário por 3 min)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoRequest' }
      responses:
        '201':
          description: Reserva criada; o próximo passo é POST /pagamentos/cobrancas
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409Agendamento' }
        '422': { $ref: '#/components/responses/Erro422' }
  /me/agendamentos:
    get:
      tags: [agenda]
      operationId: meusAgendamentos
      summary: Meus agendamentos (paginado)
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de agendamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAgendamentos' }
        '401': { $ref: '#/components/responses/Erro401' }
  /agendamentos/{id}:
    get:
      tags: [agenda]
      operationId: meuAgendamento
      summary: Um agendamento meu (404 se for de outro dono)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Agendamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404' }
  /agendamentos/guest:
    post:
      tags: [guest]
      operationId: agendarComoGuest
      summary: Reserva sem conta (nasce AGUARDANDO_PAGAMENTO, trava o horário por 3 min)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgendamentoGuestRequest' }
      responses:
        '201':
          description: |
            Reserva do guest criada; tokenGuest aparece só aqui. A API continua devolvendo o campo `tokenGuest` neste corpo;
            o BFF do Next grava o token num cookie HttpOnly e tira o campo antes de responder ao navegador (D150).
          headers:
            Location: { schema: { type: string }, example: /agendamentos/guest/3fa85f64-5717-4562-b3fc-2c963f66afa6 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoGuest' }
              examples:
                reservaCriada:
                  summary: "Reserva criada: AGUARDANDO_PAGAMENTO, com o prazo em expiraEm (o token real aparece só aqui)"
                  value: {"id": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "AGUARDANDO_PAGAMENTO", "origem": "GUEST", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60}, "barbeiro": {"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Carlos Eduardo Cândido"}, "inicio": "2026-11-24T10:00:00-03:00", "fim": "2026-11-24T11:00:00-03:00", "precoCentavos": 4500, "expiraEm": "2026-11-20T11:25:07-03:00", "motivoCancelamento": null, "version": 0, "tokenGuest": "g1_<token-mostrado-uma-única-vez>"}
        '400': { $ref: '#/components/responses/Erro400' }
        '404': { $ref: '#/components/responses/Erro404Servico' }
        '409': { $ref: '#/components/responses/Erro409Agendamento' }
        '422': { $ref: '#/components/responses/Erro422' }
        '429': { $ref: '#/components/responses/Erro429' }
  /agendamentos/guest/{id}:
    get:
      tags: [guest]
      operationId: consultarAgendamentoGuest
      summary: Status da reserva do guest (com X-Guest-Token)
      security: [ { guestToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Status da reserva do guest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
              examples:
                aguardando:
                  summary: "Antes de pagar"
                  value: {"id": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "AGUARDANDO_PAGAMENTO", "origem": "GUEST", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60}, "barbeiro": {"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Carlos Eduardo Cândido"}, "inicio": "2026-11-24T10:00:00-03:00", "fim": "2026-11-24T11:00:00-03:00", "precoCentavos": 4500, "expiraEm": "2026-11-20T11:25:07-03:00", "motivoCancelamento": null, "version": 0}
                confirmado:
                  summary: "Depois do pagamento: CONFIRMADO, sem prazo"
                  value: {"id": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "CONFIRMADO", "origem": "GUEST", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte Clássico / Social", "duracaoMin": 60}, "barbeiro": {"id": "b0000000-0000-4000-8000-000000000001", "nomeExibicao": "Carlos Eduardo Cândido"}, "inicio": "2026-11-24T10:00:00-03:00", "fim": "2026-11-24T11:00:00-03:00", "precoCentavos": 4500, "expiraEm": null, "motivoCancelamento": null, "version": 2}
        '404': { $ref: '#/components/responses/Erro404' }
  /pagamentos/cobrancas:
    post:
      tags: [pagamento]
      operationId: criarCobranca
      summary: Cria a cobrança de 100% do serviço por Pix ou cartão de crédito (CPF pedido só aqui)
      description: |
        Cliente logado usa o bearer; guest usa o cabeçalho X-Guest-Token como alternativa ao bearer (sem nenhum
        dos dois: 401). Pix devolve QR Code e copia e cola;
        cartão devolve a URL do checkout do gateway (os dados do cartão nunca passam pela API).
        Exige `aceitePolitica: true`; sem ele, 422 ACEITE_POLITICA_OBRIGATORIO.
      security: [ { bearer: [] }, { guestToken: [] } ]
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobrancaRequest' }
      responses:
        '201':
          description: Cobrança criada (único lugar com cpfMascarado, montado do CPF recebido; o CPF não é guardado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CobrancaCriada' }
              examples:
                pixSimulado:
                  summary: "Pix no modo simulado do beta: copia e cola sem QR em base64 (o front gera o QR)"
                  value: {"id": "898173a0-e09e-4e71-942b-74e08c6d121b", "reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "PENDENTE", "metodo": "PIX", "valorCentavos": 4500, "pix": {"copiaECola": "SIMULADO-898173a0-e09e-4e71-942b-74e08c6d121b", "qrCodeBase64": null, "expiraEm": "2026-11-20T11:25:07-03:00"}, "cartao": null, "cpfMascarado": "***.***.***-25"}
        '200':
          description: Repetição com a mesma chave e o mesmo corpo (sem cpfMascarado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cobranca' }
              examples:
                repeticao:
                  summary: "Mesma chave e mesmo corpo: devolve a mesma cobrança, sem cpfMascarado"
                  value: {"id": "898173a0-e09e-4e71-942b-74e08c6d121b", "reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "PENDENTE", "metodo": "PIX", "valorCentavos": 4500, "pix": {"copiaECola": "SIMULADO-898173a0-e09e-4e71-942b-74e08c6d121b", "qrCodeBase64": null, "expiraEm": "2026-11-20T11:25:07-03:00"}, "cartao": null}
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Reserva' }
        '409':
          description: |
            COBRANCA_EM_ANDAMENTO: a reserva já tem uma cobrança PENDENTE (ou PAGA) com outra chave de idempotência;
            o `detail` traz o id da existente. Só uma cobrança viva por reserva.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
              examples:
                cobrancaEmAndamento:
                  summary: "Segunda cobrança para a mesma reserva, com outra chave de idempotência"
                  value: {"detail": "Esta reserva já tem uma cobrança em andamento: 898173a0-e09e-4e71-942b-74e08c6d121b.", "instance": "/pagamentos/cobrancas", "status": 409, "title": "Cobrança em andamento", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cobranca_em_andamento", "code": "COBRANCA_EM_ANDAMENTO", "traceId": "9b3e51d7a04c4f2e8d6a1c0b7e5f3a29", "errors": []}
        '422': { $ref: '#/components/responses/Erro422' }
        '429': { $ref: '#/components/responses/Erro429' }
        '503': { $ref: '#/components/responses/Erro503' }
  /pagamentos/simulacao/{cobrancaId}/confirmar:
    post:
      tags: [pagamento]
      operationId: confirmarPagamentoSimulado
      summary: Confirma o pagamento de uma cobrança no modo simulado (só no beta, D59)
      description: |
        Só existe com `app.pagamento.modo=simulado` (o padrão do beta); no modo `asaas` a rota não existe e responde 404.
        Faz o que o gateway faria: marca a cobrança como paga no GatewaySimulado e passa pelo MESMO caminho do webhook
        (evento gravado, gateway reconsultado, reserva CONFIRMADO). Só o dono da reserva (bearer ou X-Guest-Token);
        outro usuário recebe 404. Repetir é inofensivo.
      security: [ { bearer: [] }, { guestToken: [] } ]
      parameters:
        - { name: cobrancaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cobrança depois da confirmação (status PAGA)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cobranca' }
              examples:
                paga:
                  summary: "Cobrança paga; a reserva vira CONFIRMADO"
                  value: {"id": "898173a0-e09e-4e71-942b-74e08c6d121b", "reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "status": "PAGA", "metodo": "PIX", "valorCentavos": 4500, "pix": {"copiaECola": "SIMULADO-898173a0-e09e-4e71-942b-74e08c6d121b", "qrCodeBase64": null, "expiraEm": "2026-11-20T11:25:07-03:00"}, "cartao": null}
        '401': { $ref: '#/components/responses/Erro401' }
        '404': { $ref: '#/components/responses/Erro404Cobranca' }
  /pagamentos/webhook:
    post:
      tags: [pagamento]
      operationId: receberWebhook
      summary: Aviso do gateway (Asaas), idempotente pelo id do evento
      security: [ { webhookAsaas: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookAsaas' }
      responses:
        '200': { description: Recebido (primeira vez ou repetição) }
        '401': { $ref: '#/components/responses/Erro401' }
  /admin/agenda:
    get:
      tags: [admin]
      operationId: agendaAdmin
      summary: Agenda do dia ou da semana (BARBEIRO só a própria, H9)
      description: |
        Dia civil no fuso da barbearia; a semana vai de segunda a domingo. Não traz reservas EXPIRADO nem
        AGUARDANDO_PAGAMENTO já vencidas (não ocupam horário, R15). Ordem: início, depois id. Sem paginação.
        Barbeiro inexistente, alheio ou conta BARBEIRO sem vínculo: 404.
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, format: date } }
        - { name: visao, in: query, required: false, schema: { type: string, enum: [DIA, SEMANA], default: DIA } }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Agenda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/agendamentos:
    post:
      tags: [admin]
      operationId: criarReservaManual
      summary: Trava um horário combinado por WhatsApp, fora do app (reserva manual)
      description: |
        ADMIN para qualquer barbeiro; BARBEIRO só para si (barbeiro alheio, inexistente ou conta sem vínculo: 404).
        A reserva nasce `CONFIRMADO`, com `origem = MANUAL`, sem cobrança, sem aceite de política e sem prazo. Respeita
        jornada, almoço, folga, granularidade, serviço ativo e o horizonte; a antecedência mínima **não** vale, mas um
        horário que já passou é `422 ANTECEDENCIA_INSUFICIENTE`. Horário ocupado (inclusive por corrida): `409
        HORARIO_INDISPONIVEL`. Grava auditoria na mesma transação. Pode ser concluída ou marcada como falta por
        `PATCH /admin/agendamentos/{id}/status`; só o ADMIN cancela (sem cobrança, nada vai para devolução). Não guarda
        WhatsApp, e-mail nem CPF do cliente; `nomeCliente` e `observacao` são anonimizados 90 dias depois do fim da
        reserva. Pagamento por fora (dinheiro, Pix direto) não gera registro financeiro. Não conta no alcance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaManualRequest' }
      responses:
        '201':
          description: Horário travado
          headers:
            Location: { schema: { type: string }, description: '/admin/agendamentos/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/agendamentos/{id}/status:
    patch:
      tags: [admin]
      operationId: mudarStatusAgendamento
      summary: Conclui, marca falta (NAO_COMPARECEU, valor retido) ou cancela pela barbearia
      description: |
        CONCLUIDO e NAO_COMPARECEU: ADMIN ou BARBEIRO (só da própria agenda), a partir do horário de início.
        CANCELADO: só ADMIN (BARBEIRO recebe 403), com `motivo`; a cobrança paga vira DEVOLUCAO_PENDENTE e a
        pendente vira CANCELADA. Ordem das checagens: 404, 403, 422 MOTIVO_OBRIGATORIO, 409 CONFLITO_DE_VERSAO e
        422 TRANSICAO_INVALIDA (máquina de estados e "antes do início").
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MudancaStatusRequest' }
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/minha-jornada:
    get:
      tags: [admin]
      operationId: minhaJornada
      summary: A jornada semanal do barbeiro ligado à conta de quem chama (1.7.0)
      description: |
        ADMIN ou BARBEIRO. O barbeiro vem do `sub` do token (não há id na URL: ninguém lê a jornada de outro). É o que
        a agenda do BARBEIRO usa para listrar o almoço, já que ele não lê `GET /admin/barbeiros` (só ADMIN). Conta sem
        barbeiro ligado (inclusive um ADMIN sem vínculo): 404. Só leitura; quem edita a jornada é o ADMIN. Nunca em cache.
      responses:
        '200':
          description: O barbeiro da conta e os intervalos de trabalho da semana (`intervalos` vazio se não há expediente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinhaJornada' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/servicos:
    get:
      tags: [admin]
      operationId: listarServicosAdmin
      summary: Lista serviços, inclusive inativos
      description: |
        Só ADMIN. Inclui `ativo` e `version`. O serviço nunca é apagado: sai de cena com `ativo = false` e some de `GET /servicos`.
      responses:
        '200':
          description: Serviços (inclusive inativos)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicoAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    post:
      tags: [admin]
      operationId: criarServico
      summary: Cria serviço
      description: |
        Só ADMIN. Preço de 1 centavo para cima, duração de 5 a 480 min. Nome único sem diferença de maiúsculas
        (`409 NOME_JA_EXISTE`, inclusive na corrida de dois pedidos). Campo fora do contrato (`id`, `ativo`) é `400 CAMPO_DESCONHECIDO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { schema: { type: string }, description: '/admin/servicos/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/servicos/{id}:
    put:
      tags: [admin]
      operationId: alterarServico
      summary: Altera nome, duração, preço ou ativo
      description: |
        Só ADMIN. Substitui os campos e exige a `version` que a tela viu (`409 CONFLITO_DE_VERSAO` se mudou).
        Preço e duração novos valem só para as reservas novas: reserva e cobrança antigas não são reescritas.
        Desativar não cancela reserva futura.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoUpdateRequest' }
      responses:
        '200':
          description: Alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros:
    get:
      tags: [admin]
      operationId: listarBarbeirosAdmin
      summary: Lista barbeiros
      responses:
        '200':
          description: Barbeiros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    post:
      tags: [admin]
      operationId: criarBarbeiro
      summary: Cria barbeiro
      description: |
        Só ADMIN. `usuarioId`, se vier, é de uma conta ativa com o papel BARBEIRO (senão `400` no campo `usuarioId`) e
        que ainda não é de outro barbeiro (`409 USUARIO_JA_VINCULADO`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarbeiroRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { schema: { type: string }, description: '/admin/barbeiros/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros/{id}:
    put:
      tags: [admin]
      operationId: alterarBarbeiro
      summary: Altera nome, WhatsApp, ativo ou login vinculado
      description: |
        Só ADMIN. Substitui os campos (sem `usuarioId` o barbeiro fica sem conta; sem `whatsapp`, sem número) e exige a `version` que a tela viu.
        Inativar tira o barbeiro de `GET /barbeiros` e da disponibilidade, mas não cancela reserva futura.
        A conta ligada passa a ver a própria agenda em `GET /admin/agenda`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarbeiroUpdateRequest' }
      responses:
        '200':
          description: Alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros/{id}/jornada:
    put:
      tags: [admin]
      operationId: substituirJornada
      summary: Substitui a jornada semanal
      description: |
        Só ADMIN. Substitui a semana inteira numa transação; no máximo 28 intervalos; lista vazia é válida (sem expediente).
        Dois intervalos do mesmo dia que se sobrepõem são `422 JORNADA_SOBREPOSTA`; encostar (12:00 e 12:00) não é sobrepor.
        Hora inválida (`25:00`), fim antes do início ou dia fora de 1 a 7 é `400`. Reservas já feitas fora da nova jornada continuam válidas.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/IntervaloJornada' }
      responses:
        '200':
          description: Jornada substituída
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IntervaloJornada' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/barbeiros/{id}/folgas:
    get:
      tags: [admin]
      operationId: listarFolgas
      summary: Folgas do barbeiro de hoje em diante (sem listar, a tela não sabe o que remover)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Folgas de hoje em diante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folga' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [admin]
      operationId: criarFolga
      summary: Cria folga
      description: |
        Só ADMIN. Período meio aberto [inicio, fim): `fim` depois de `inicio` e não toda no passado (`400`); `motivo` até 200 caracteres.
        Com reserva ativa (CONFIRMADO, ou AGUARDANDO_PAGAMENTO com prazo aberto) no período: `422 FOLGA_COM_RESERVAS`.
        Folga e reserva simultâneas nunca passam juntas: a transação trava a linha do barbeiro.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolgaRequest' }
      responses:
        '201':
          description: Folga criada
          headers:
            Location: { schema: { type: string }, description: '/admin/barbeiros/{id}/folgas/{folgaId}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folga' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/barbeiros/{id}/folgas/{folgaId}:
    delete:
      tags: [admin]
      operationId: removerFolga
      summary: Remove folga
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: folgaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/pagamentos:
    get:
      tags: [admin]
      operationId: listarPagamentosAdmin
      summary: Cobranças por status, inclusive pagas depois de expirar (pendência administrativa)
      description: |
        Só ADMIN. Sem `status`: as pendências (PAGA_APOS_EXPIRACAO e DEVOLUCAO_PENDENTE), as mais antigas primeiro.
        Com `status`: aquele status, as mais recentes primeiro. `status` desconhecido, `pagina` negativa ou
        `tamanho` fora de 1 a 50: 400.
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/StatusCobranca' } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de cobranças
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaCobrancas' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/pagamentos/{id}/devolucao:
    post:
      tags: [admin]
      operationId: registrarDevolucao
      summary: Registra devolução manual feita (só cancelamento pela barbearia ou pagamento tardio sem horário)
      description: |
        No beta o estorno é feito fora do app (no Pix de volta do Eduardo); a API só registra. DEVOLUCAO_PENDENTE ou
        PAGA_APOS_EXPIRACAO viram DEVOLVIDA. Repetir a devolução é 422 e não altera a data original.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Devolução registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cobranca' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/pagamentos/eventos:
    get:
      tags: [admin]
      operationId: listarEventosEmRevisao
      summary: Eventos do gateway que esgotaram as tentativas (REVISAO_MANUAL), os mais antigos primeiro
      description: Sem payload e sem dado pessoal. Só ADMIN.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEventos' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/pagamentos/eventos/{id}/revisao:
    post:
      tags: [admin]
      operationId: marcarEventoRevisado
      summary: Marca o evento como revisado (tira da fila; não reprocessa)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Evento revisado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoWebhookAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/configuracao:
    get:
      tags: [admin]
      operationId: lerConfiguracao
      summary: Lê as regras configuráveis da agenda
      responses:
        '200':
          description: Configuração da agenda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    put:
      tags: [admin]
      operationId: alterarConfiguracao
      summary: Altera as regras configuráveis da agenda
      description: |
        Só ADMIN. Exige a `version` que a tela viu (`409 CONFLITO_DE_VERSAO`). Valores fora dos limites são `400` com o campo em
        `errors[]`; mandar `fuso` é `400 CAMPO_DESCONHECIDO` (só leitura). Vale na próxima requisição e não reescreve reservas existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
      responses:
        '200':
          description: Alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/auditoria:
    get:
      tags: [admin]
      operationId: listarAuditoria
      summary: Ações do painel (paginado, as mais recentes primeiro)
      description: Só ADMIN. O IP da requisição fica guardado no banco e não sai na API.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de ações auditadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/alcance:
    get:
      tags: [admin]
      operationId: alcanceAdmin
      summary: De onde vêm os atendimentos (cidades e bairros, com contagem e percentual)
      description: |
        ADMIN vê todos os barbeiros ou filtra por `barbeiroId`; BARBEIRO vê **sempre só os próprios** atendimentos (o
        `barbeiroId` da query é trocado pelo dele, E36). Conta só reservas `CONFIRMADO` e `CONCLUIDO` com `inicio` no
        período (E31); reserva sem região entra em `semRegiao`. Período em dias civis no fuso da barbearia, inclusive nas
        duas pontas; padrão: os últimos 30 dias (hoje e os 29 anteriores). Máximo de 366 dias. K-anonimato (E32): bairro
        com menos de 5 atendimentos na cidade vira "Outros bairros"; cidade com menos de 5 vira "Outras cidades" (`uf`
        nula). O `percentual` de cada linha é sobre o `total` do período (1 casa decimal). Nunca em cache.
      parameters:
        - { name: de, in: query, required: false, schema: { type: string, format: date }, description: 'primeiro dia do período (padrão: 29 dias antes de `ate`)' }
        - { name: ate, in: query, required: false, schema: { type: string, format: date }, description: 'último dia do período (padrão: hoje)' }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid }, description: 'só para ADMIN; BARBEIRO é sempre o próprio' }
      responses:
        '200':
          description: Alcance do período
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlcancePainel' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
      description: Token devolvido uma única vez na criação da reserva do guest
    webhookAsaas:
      type: apiKey
      in: header
      name: asaas-access-token
      description: Token configurado no webhook do Asaas (variável GATEWAY_SEGREDO_WEBHOOK)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    Erro400:
      description: "Pedido inválido: campo faltando ou com formato errado. `errors[]` diz qual campo e por quê."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            validacaoInvalida:
              summary: "Campos obrigatórios faltando (POST /agendamentos/guest)"
              value: {"detail": "Um ou mais campos estão inválidos.", "instance": "/agendamentos/guest", "status": 400, "title": "Dados inválidos", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#validacao_invalida", "code": "VALIDACAO_INVALIDA", "traceId": "181d75b340244392b54f2346e0ee2feb", "errors": [{"field": "barbeiroId", "message": "obrigatório"}, {"field": "email", "message": "obrigatório"}, {"field": "nome", "message": "obrigatório"}, {"field": "whatsapp", "message": "obrigatório"}]}
            cpfInvalido:
              summary: "CPF com dígito verificador errado (POST /pagamentos/cobrancas)"
              value: {"detail": "O CPF informado não é válido.", "instance": "/pagamentos/cobrancas", "status": 400, "title": "CPF inválido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cpf_invalido", "code": "CPF_INVALIDO", "traceId": "2c0693c76ab34adfae4b9399113f24ba", "errors": []}
            cepInvalido:
              summary: "CEP fora do formato (GET /cep/123)"
              value: {"detail": "O CEP deve ter 8 dígitos.", "instance": "/cep/123", "status": 400, "title": "CEP inválido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cep_invalido", "code": "CEP_INVALIDO", "traceId": "3b7cc30a9d50453c8b719ea2d390c308", "errors": []}
    Erro401:
      description: "Não autenticado: sem token, token vencido ou credenciais erradas."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoAutenticado:
              summary: "Rota protegida chamada sem token (GET /me)"
              value: {"detail": "Faça login para continuar.", "instance": "/me", "status": 401, "title": "Não autenticado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#nao_autenticado", "code": "NAO_AUTENTICADO", "traceId": "5ea662f2dc9149d9a0d59415a8898671", "errors": []}
            credenciaisInvalidas:
              summary: "Login com e-mail ou senha errados"
              value: {"detail": "E-mail ou senha inválidos.", "instance": "/auth/login", "status": 401, "title": "Credenciais inválidas", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#credenciais_invalidas", "code": "CREDENCIAIS_INVALIDAS", "traceId": "fbd5469059494434a20b33d2b9006235", "errors": []}
    Erro403:
      description: "Sem permissão: o papel de quem chama não pode usar esta rota."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            acessoNegado:
              summary: "CLIENTE tentando abrir o painel (GET /admin/agenda)"
              value: {"detail": "Você não tem permissão para esta ação.", "instance": "/admin/agenda", "status": 403, "title": "Acesso negado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#acesso_negado", "code": "ACESSO_NEGADO", "traceId": "16b9141caf824089a605c5cbe899a44a", "errors": []}
    Erro404:
      description: "Não encontrado ou de outro dono. Recurso alheio também responde 404, para não revelar que existe (BOLA, ADR 0005)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "Reserva de visitante com o token errado"
              value: {"detail": "Agendamento não encontrado.", "instance": "/agendamentos/guest/0baf3fc1-4b92-458e-baed-c07646d94692", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "2f051080e00b447abc09e1d5ec863287", "errors": []}
    Erro404Servico:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "servicoId que não existe (GET /disponibilidade ou POST /agendamentos/guest)"
              value: {"detail": "Serviço não encontrado.", "instance": "/disponibilidade", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "7d41c0e2b39a4f6c8e15a2b0d9c3f871", "errors": []}
    Erro404Reserva:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "reservaId que não existe ou é de outro dono (POST /pagamentos/cobrancas)"
              value: {"detail": "Reserva não encontrada.", "instance": "/pagamentos/cobrancas", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "c2e8a95f1b7d4e03a6f4d18b2c9e7a50", "errors": []}
    Erro404Cobranca:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "cobrancaId que não existe ou é de outro dono"
              value: {"detail": "Cobrança não encontrada.", "instance": "/pagamentos/simulacao/568ecc7e-3b1a-4c2d-9e8f-0a1b2c3d4e5f/confirmar", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "e4b07d2c9a1f4b68b35e0c7d91a2f6e3", "errors": []}
    Erro409:
      description: "Conflito com o estado atual (e-mail repetido, versão antiga, nome repetido)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            emailJaCadastrado:
              summary: "Cadastro com e-mail que já tem conta"
              value: {"detail": "Já existe uma conta com este e-mail.", "instance": "/auth/cadastro", "status": 409, "title": "E-mail já cadastrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#email_ja_cadastrado", "code": "EMAIL_JA_CADASTRADO", "traceId": "49fe5f2a980c4558810d312776968816", "errors": []}
    Erro409Agendamento:
      description: |
        Conflito ao reservar. HORARIO_INDISPONIVEL = horário ocupado (o front esconde o horário).
        CONFLITO_CONCORRENTE = deadlock que persistiu depois do retry interno; o horário pode estar livre,
        o front não o esconde e pode repetir a mesma requisição uma vez (ADR 0003).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            horarioIndisponivel:
              summary: "Outro cliente reservou o mesmo horário antes"
              value:
                type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#horario_indisponivel
                title: Horário indisponível
                status: 409
                detail: Este horário acabou de ser reservado. Escolha outro.
                instance: /agendamentos/guest
                code: HORARIO_INDISPONIVEL
                traceId: e85960c98be6444b99f2a959a6625350
                errors: []
            conflitoConcorrente:
              summary: "Deadlock que persistiu depois do retry interno (o instance é o caminho chamado: /agendamentos/guest ou /agendamentos)"
              value:
                type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#conflito_concorrente
                title: Conflito momentâneo
                status: 409
                detail: Muitas reservas ao mesmo tempo. Tente de novo.
                instance: /agendamentos/guest
                code: CONFLITO_CONCORRENTE
                traceId: 0af7651916cd43dd8448eb211c80319c
                errors: []
    Erro422:
      description: "Regra de negócio: o pedido está bem formado, mas a regra não deixa."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            foraDoHorizonte:
              summary: "Data além do horizonte da agenda (GET /disponibilidade)"
              value: {"detail": "A agenda aceita datas de hoje até 30 dias à frente.", "instance": "/disponibilidade", "status": 422, "title": "Data além do permitido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#fora_do_horizonte", "code": "FORA_DO_HORIZONTE", "traceId": "a63f7bfb96e54c42a5b75964242a0775", "errors": []}
            aceiteObrigatorio:
              summary: "Cobrança sem aceitar a política de pagamento"
              value: {"detail": "Aceite a política de pagamento para continuar.", "instance": "/pagamentos/cobrancas", "status": 422, "title": "Aceite da política obrigatório", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#aceite_politica_obrigatorio", "code": "ACEITE_POLITICA_OBRIGATORIO", "traceId": "0131a184037443a48f1f0ddf801f565b", "errors": []}
    Erro429:
      description: Limite de tentativas
      headers:
        Retry-After: { schema: { type: integer }, description: segundos }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Erro503: { description: Serviço externo indisponível, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  schemas:
    Problema:
      type: object
      description: RFC 9457 Problem Details com extensões code, traceId e errors
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/CodigoErro' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
      example:
        type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#horario_indisponivel
        title: Horário indisponível
        status: 409
        detail: Este horário acabou de ser reservado. Escolha outro.
        instance: /agendamentos
        code: HORARIO_INDISPONIVEL
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors: []
    CodigoErro:
      type: string
      enum: [VALIDACAO_INVALIDA, JSON_MALFORMADO, CAMPO_DESCONHECIDO, CEP_INVALIDO, CPF_INVALIDO,
             IDEMPOTENCY_KEY_AUSENTE, NAO_AUTENTICADO, CREDENCIAIS_INVALIDAS, REFRESH_INVALIDO,
             REFRESH_REUTILIZADO, WEBHOOK_NAO_AUTENTICADO, ACESSO_NEGADO, RECURSO_NAO_ENCONTRADO,
             TROCA_DE_SENHA_OBRIGATORIA, CEP_NAO_ENCONTRADO, FUNCIONALIDADE_DESLIGADA, METODO_NAO_PERMITIDO, MIDIA_NAO_SUPORTADA, EMAIL_JA_CADASTRADO, HORARIO_INDISPONIVEL,
             CONFLITO_DE_VERSAO, CONFLITO_CONCORRENTE, NOME_JA_EXISTE, FORA_DO_EXPEDIENTE, ANTECEDENCIA_INSUFICIENTE,
             FORA_DO_HORIZONTE, ACEITE_POLITICA_OBRIGATORIO, TRANSICAO_INVALIDA, MOTIVO_OBRIGATORIO,
             RESERVA_EXPIRADA, COBRANCA_EM_ANDAMENTO, SERVICO_INATIVO, IDEMPOTENCIA_CONFLITO, JORNADA_SOBREPOSTA,
             FOLGA_COM_RESERVAS, USUARIO_JA_VINCULADO, LIMITE_EXCEDIDO, GATEWAY_INDISPONIVEL, CEP_INDISPONIVEL,
             EXCLUSAO_BLOQUEADA_POR_RESERVA, ERRO_INTERNO]
    StatusReserva:
      type: string
      enum: [AGUARDANDO_PAGAMENTO, CONFIRMADO, CONCLUIDO, NAO_COMPARECEU, CANCELADO, EXPIRADO]
    StatusCobranca:
      type: string
      enum: [PENDENTE, PAGA, PAGA_APOS_EXPIRACAO, CANCELADA, FALHOU, DEVOLUCAO_PENDENTE, DEVOLVIDA]
    Papel:
      type: string
      enum: [CLIENTE, BARBEIRO, ADMIN]
    Servico:
      type: object
      required: [id, nome, duracaoMin, precoCentavos]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        duracaoMin: { type: integer }
        precoCentavos: { type: integer, format: int64 }
        precoFormatado: { type: string, example: 'R$ 55,00', description: 'espaço normal depois de R$; milhar com ponto' }
    ServicoAdmin:
      allOf:
        - $ref: '#/components/schemas/Servico'
        - type: object
          required: [ativo, version]
          properties:
            descricao: { type: [string, 'null'] }
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    ServicoRequest:
      type: object
      additionalProperties: false
      required: [nome, duracaoMin, precoCentavos]
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        descricao: { type: string, maxLength: 300 }
        duracaoMin: { type: integer, minimum: 5, maximum: 480 }
        precoCentavos: { type: integer, format: int64, minimum: 1, description: 'pelo menos 1 centavo: a reserva exige preço maior que zero' }
    ServicoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ServicoRequest'
        - type: object
          required: [ativo, version]
          properties:
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    BarbeiroResumo:
      type: object
      required: [id, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        nomeExibicao: { type: string }
    BarbeiroPublico:
      description: O barbeiro de `GET /barbeiros`, com o WhatsApp comercial (D122).
      allOf:
        - $ref: '#/components/schemas/BarbeiroResumo'
        - type: object
          required: [whatsapp]
          properties:
            whatsapp: { type: [string, 'null'], pattern: '^[0-9]{10,13}$', description: 'só dígitos, com DDD e DDI opcional', example: '5511912345678' }
    BarbeiroAdmin:
      allOf:
        - $ref: '#/components/schemas/BarbeiroPublico'
        - type: object
          required: [ativo, version]
          properties:
            usuarioId: { type: [string, 'null'], format: uuid }
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
            jornada:
              type: array
              items: { $ref: '#/components/schemas/IntervaloJornada' }
    BarbeiroRequest:
      type: object
      additionalProperties: false
      required: [nomeExibicao]
      properties:
        nomeExibicao: { type: string, minLength: 2, maxLength: 80 }
        usuarioId: { type: string, format: uuid, description: 'conta ativa com o papel BARBEIRO e ainda sem barbeiro (409 USUARIO_JA_VINCULADO)' }
        whatsapp: { type: string, description: 'opcional; WhatsApp comercial, de 10 a 13 dígitos, com ou sem máscara (a resposta devolve só dígitos)', example: '(11) 91234-5678' }
    BarbeiroUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/BarbeiroRequest'
        - type: object
          required: [ativo, version]
          properties:
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    MinhaJornada:
      type: object
      required: [barbeiroId, nomeExibicao, intervalos]
      properties:
        barbeiroId: { type: string, format: uuid, description: 'o barbeiro ligado à conta; a reserva manual do BARBEIRO usa este id' }
        nomeExibicao: { type: string }
        intervalos:
          type: array
          items: { $ref: '#/components/schemas/IntervaloJornada' }
    IntervaloJornada:
      type: object
      additionalProperties: false
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana: { type: integer, minimum: 1, maximum: 7, description: 'ISO-8601: 1 = segunda' }
        horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00' }
        horaFim: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '19:00' }
    FolgaRequest:
      type: object
      additionalProperties: false
      required: [inicio, fim]
      properties:
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        motivo: { type: string, maxLength: 200 }
    Folga:
      allOf:
        - $ref: '#/components/schemas/FolgaRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Disponibilidade:
      type: object
      required: [data, fuso, servicoId, duracaoMin, barbeiros]
      properties:
        data: { type: string, format: date }
        fuso: { type: string, example: America/Sao_Paulo }
        servicoId: { type: string, format: uuid }
        duracaoMin: { type: integer }
        barbeiros:
          type: array
          items:
            type: object
            required: [barbeiroId, nomeExibicao, horarios]
            properties:
              barbeiroId: { type: string, format: uuid }
              nomeExibicao: { type: string }
              horarios:
                type: array
                description: inícios livres em ordem crescente, sempre com segundos e offset; vazio quando não há horário
                items: { type: string, format: date-time, example: '2026-12-01T07:00:00-03:00' }
    Endereco:
      type: object
      required: [cep]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: [string, 'null'] }
        bairro: { type: [string, 'null'] }
        cidade: { type: [string, 'null'] }
        uf: { type: [string, 'null'] }
        fonte: { type: string, enum: [VIACEP, BRASILAPI, CACHE], description: 'quem respondeu; CACHE quando veio da memória da API (7 dias se encontrado, 1 hora se inexistente)' }
    CadastroRequest:
      type: object
      additionalProperties: false
      required: [nome, email, whatsapp, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        whatsapp: { type: string, description: 'aceita máscara; 10 a 13 dígitos depois de sanitizar', example: '(11) 90000-0001' }
        senha: { type: string, minLength: 10, maxLength: 72, writeOnly: true }
        cep: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$' }
        aceitaMarketing: { type: boolean, default: false }
    Perfil:
      type: object
      required: [id, nome, email, papeis]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        papeis:
          type: array
          items: { $ref: '#/components/schemas/Papel' }
        endereco:
          type: object
          properties:
            cep: { type: [string, 'null'] }
            bairro: { type: [string, 'null'] }
            cidade: { type: [string, 'null'] }
            uf: { type: [string, 'null'] }
            completo: { type: boolean }
        deveTrocarSenha: { type: boolean, description: 'true enquanto o admin usa a senha inicial; o front leva para a troca' }
    TrocaDeSenhaRequest:
      type: object
      additionalProperties: false
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, writeOnly: true }
        novaSenha: { type: string, writeOnly: true, description: 'de 10 a 72 bytes em UTF-8' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Tokens:
      type: object
      required: [accessToken, tipo, expiraEmSegundos, refreshToken, refreshExpiraEm, usuario]
      properties:
        accessToken: { type: string }
        tipo: { type: string, const: Bearer }
        expiraEmSegundos: { type: integer, example: 900 }
        refreshToken: { type: string, description: 'lido só pelo BFF, que guarda em cookie HttpOnly' }
        refreshExpiraEm: { type: string, format: date-time }
        usuario:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            papeis:
              type: array
              items: { $ref: '#/components/schemas/Papel' }
        deveTrocarSenha: { type: boolean }
    AgendamentoRequest:
      type: object
      additionalProperties: false
      required: [servicoId, barbeiroId, inicio]
      properties:
        servicoId: { type: string, format: uuid }
        barbeiroId: { type: string, format: uuid }
        inicio: { type: string, format: date-time, example: '2026-12-01T10:00:00-03:00' }
    AgendamentoGuestRequest:
      allOf:
        - $ref: '#/components/schemas/AgendamentoRequest'
        - type: object
          required: [nome, email, whatsapp]
          properties:
            nome: { type: string, minLength: 2, maxLength: 120 }
            email: { type: string, format: email }
            whatsapp: { type: string }
            cep:
              type: [string, 'null']
              pattern: '^[0-9]{5}-?[0-9]{3}$'
              example: '01001-000'
              description: |
                Opcional (Fatia 6C). Formato errado: `400 CEP_INVALIDO`, nada é criado. CEP inexistente ou provedor de CEP
                fora **nunca** impedem a reserva (R31): ela nasce sem região. Guardado só para a estatística de alcance e
                apagado na anonimização do visitante (90 dias).
    Agendamento:
      type: object
      required: [id, status, origem, inicio, fim, precoCentavos]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusReserva' }
        origem: { type: string, enum: [CLIENTE, GUEST, MANUAL], description: 'MANUAL só aparece no painel (reserva travada pela barbearia, 1.6.0)' }
        servico:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            duracaoMin: { type: integer }
        barbeiro: { $ref: '#/components/schemas/BarbeiroResumo' }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        precoCentavos: { type: integer, format: int64, description: 'congelado na reserva; é o valor cobrado (100%)' }
        expiraEm: { type: [string, 'null'], format: date-time, description: 'prazo do pagamento (3 min por padrão, R7); nulo depois de CONFIRMADO' }
        motivoCancelamento: { type: [string, 'null'], description: 'só em cancelamento pela barbearia' }
        version: { type: integer, format: int64 }
    AgendamentoAdmin:
      description: |
        O Agendamento visto pelo painel: mais o contato de quem vem (nome e WhatsApp, nunca e-mail nem CPF) e o status
        da cobrança (nulo quando a reserva não tem cobrança).
      allOf:
        - $ref: '#/components/schemas/Agendamento'
        - type: object
          required: [cliente]
          properties:
            observacao: { type: [string, 'null'], description: 'só na reserva manual; dado pessoal em potencial, anonimizado em 90 dias' }
            cliente:
              type: object
              required: [nome]
              properties:
                nome: { type: string, description: 'na reserva manual sem nome informado (ou já anonimizada): `Sem nome`' }
                whatsapp: { type: [string, 'null'], description: 'só dígitos, com DDD', example: '11988880001' }
            cobrancaStatus:
              oneOf:
                - { $ref: '#/components/schemas/StatusCobranca' }
                - { type: 'null' }
    AgendamentoGuest:
      allOf:
        - $ref: '#/components/schemas/Agendamento'
        - type: object
          required: [tokenGuest, expiraEm]
          properties:
            tokenGuest: { type: string, description: 'mostrado uma única vez; o banco guarda só o hash. A API sempre devolve o campo; o BFF grava o token num cookie HttpOnly e o tira do corpo antes de responder ao navegador (D150)' }
    PaginaAgendamentos:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Agendamento' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    ReservaManualRequest:
      type: object
      additionalProperties: false
      required: [servicoId, barbeiroId, inicio]
      properties:
        servicoId: { type: string, format: uuid }
        barbeiroId: { type: string, format: uuid }
        inicio: { type: string, format: date-time }
        nomeCliente: { type: string, maxLength: 80, description: 'opcional; dado pessoal; vazio vira ausente' }
        observacao: { type: string, maxLength: 200, description: 'opcional; não digitar telefone nem documento' }
    MudancaStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [CONCLUIDO, NAO_COMPARECEU, CANCELADO] }
        motivo: { type: string, maxLength: 300, description: obrigatório quando status = CANCELADO }
        version: { type: integer, format: int64 }
    CobrancaRequest:
      type: object
      additionalProperties: false
      required: [reservaId, metodo, cpf, aceitePolitica, versaoPolitica]
      properties:
        reservaId: { type: string, format: uuid }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        cpf: { type: string, writeOnly: true, description: 'validado, repassado ao gateway e não gravado (ADR 0009)', example: '123.456.789-09' }
        aceitePolitica:
          type: boolean
          const: true
          description: |
            Checkbox obrigatório: "Após o pagamento antecipado de 100%, não há cancelamento,
            remarcação ou estorno em caso de desistência ou falta." Ausente ou false: 422 ACEITE_POLITICA_OBRIGATORIO.
        versaoPolitica: { type: integer, minimum: 1, description: 'versão do texto exibido (GET /politica-pagamento); a API grava versão e data do aceite' }
    Cobranca:
      type: object
      required: [id, reservaId, status, valorCentavos]
      properties:
        id: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusCobranca' }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        valorCentavos: { type: integer, format: int64, description: '100% do precoCentavos da reserva' }
        devolvidaEm: { type: [string, 'null'], format: date-time, description: 'só na resposta de POST /admin/pagamentos/{id}/devolucao e nas cobranças devolvidas' }
        pix:
          type: [object, 'null']
          description: preenchido quando metodo = PIX
          properties:
            copiaECola: { type: string }
            qrCodeBase64:
              type: [string, 'null']
              description: |
                PNG em base64. Nulo no modo simulado do beta (D59, D68): o front gera o QR a partir do copiaECola.
                Também nulo na repetição da criação (200), que não guarda a imagem.
            expiraEm: { type: string, format: date-time, description: 'igual ao expiraEm da reserva' }
        cartao:
          type: [object, 'null']
          description: preenchido quando metodo = CARTAO_CREDITO
          properties:
            urlCheckout: { type: string, format: uri, description: 'checkout hospedado do gateway; a API nunca recebe número de cartão (escopo PCI DSS reduzido)' }
            expiraEm: { type: string, format: date-time }
    CobrancaCriada:
      description: Resposta 201 da criação. Só aqui existe cpfMascarado.
      allOf:
        - $ref: '#/components/schemas/Cobranca'
        - type: object
          required: [cpfMascarado]
          properties:
            cpfMascarado: { type: string, example: '***.***.***-09' }
    MetodoPagamento:
      type: string
      enum: [PIX, CARTAO_CREDITO]
    PoliticaPagamento:
      type: object
      required: [versao, texto]
      properties:
        versao: { type: integer, example: 1 }
        texto:
          type: string
          example: Após o pagamento antecipado de 100%, não há cancelamento, remarcação ou estorno em caso de desistência ou falta.
    PaginaCobrancas:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/CobrancaAdmin' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    CobrancaAdmin:
      description: |
        A Cobranca para o painel: sem `pix` e sem `cartao` (o painel não precisa do copia e cola nem do link) e com o resumo da
        reserva e o contato de quem pagou, para o Eduardo saber para quem fazer o Pix de volta. Nunca CPF nem e-mail.
      type: object
      required: [id, reservaId, status, valorCentavos]
      properties:
        id: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusCobranca' }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        valorCentavos: { type: integer, format: int64 }
        criadoEm: { type: string, format: date-time }
        devolvidaEm: { type: [string, 'null'], format: date-time }
        reserva:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            inicio: { type: string, format: date-time }
            servico: { type: string }
            statusReserva: { $ref: '#/components/schemas/StatusReserva' }
            motivoCancelamento: { type: [string, 'null'] }
        contato:
          type: [object, 'null']
          properties:
            nome: { type: string }
            whatsapp: { type: [string, 'null'], example: '11988880001' }
    EventoWebhookAdmin:
      description: Evento do gateway que esgotou as tentativas. Sem payload e sem dado pessoal; `ultimoErro` é só o código do erro.
      type: object
      required: [id, tipo, recebidoEm, tentativas, resultado]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, example: PAYMENT_RECEIVED }
        recebidoEm: { type: string, format: date-time }
        tentativas: { type: integer }
        ultimoErro: { type: [string, 'null'], example: SEM_COBRANCA }
        idCobrancaProvedor: { type: [string, 'null'] }
        resultado: { type: string, enum: [REVISAO_MANUAL, REVISADO] }
        processadoEm: { type: [string, 'null'], format: date-time }
    PaginaEventos:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EventoWebhookAdmin' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    WebhookAsaas:
      type: object
      description: Campos que a API lê do evento do Asaas; o resto é ignorado
      required: [id, event]
      properties:
        id: { type: string, example: evt_teste_0001 }
        event: { type: string, example: PAYMENT_RECEIVED }
        payment:
          type: object
          properties:
            id: { type: string }
            billingType: { type: string }
            status: { type: string }
    ConfiguracaoAgenda:
      type: object
      additionalProperties: false
      required: [antecedenciaMinimaMin, intervaloEntreAtendimentosMin, granularidadeMin, horizonteDias,
                 expiracaoPagamentoMin, version]
      properties:
        fuso: { type: string, readOnly: true, example: America/Sao_Paulo, description: 'só leitura: mandar o campo no PUT é 400 CAMPO_DESCONHECIDO' }
        antecedenciaMinimaMin: { type: integer, minimum: 0, example: 120, description: 'H5: 2 horas' }
        intervaloEntreAtendimentosMin: { type: integer, minimum: 0, maximum: 120, example: 0, description: 'H4: sem intervalo' }
        granularidadeMin: { type: integer, enum: [5, 10, 15, 20, 30, 60], example: 30, description: 'H11: 30 min' }
        horizonteDias: { type: integer, minimum: 1, maximum: 365, example: 30, description: 'H12: 30 dias' }
        expiracaoPagamentoMin: { type: integer, minimum: 3, maximum: 60, example: 3 }
        version: { type: integer, format: int64 }
    Consentimento:
      type: object
      required: [finalidade, aceito, versaoTexto, registradoEm]
      properties:
        finalidade: { type: string, enum: [MARKETING_CEP] }
        aceito: { type: boolean }
        versaoTexto: { type: string }
        registradoEm: { type: string, format: date-time }
    ConsentimentoRequest:
      type: object
      additionalProperties: false
      required: [aceito, versaoTexto]
      properties:
        aceito: { type: boolean }
        versaoTexto: { type: string, maxLength: 20 }
    ExportacaoDados:
      type: object
      required: [geradoEm, conta, consentimentos, agendamentos]
      properties:
        geradoEm: { type: string, format: date-time }
        conta:
          type: object
          required: [nome, email, whatsapp, endereco]
          properties:
            nome: { type: string }
            email: { type: string, format: email }
            whatsapp: { type: [string, 'null'] }
            endereco:
              type: [object, 'null']
              properties:
                cep: { type: string }
                bairro: { type: [string, 'null'] }
                cidade: { type: [string, 'null'] }
                uf: { type: [string, 'null'] }
        consentimentos:
          type: array
          description: histórico inteiro, do mais antigo para o mais novo
          items: { $ref: '#/components/schemas/Consentimento' }
        agendamentos:
          type: array
          description: só as reservas em que a conta é o cliente
          items:
            type: object
            required: [id, inicio, fim, status, servico, precoCentavos, motivoCancelamento]
            properties:
              id: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              fim: { type: string, format: date-time }
              status: { type: string }
              servico: { type: string }
              precoCentavos: { type: integer, format: int64 }
              motivoCancelamento: { type: [string, 'null'] }
    PoliticaPrivacidade:
      type: object
      required: [versao, textoConsentimento, politica, atualizadaEm]
      properties:
        versao: { type: string, example: '1.1' }
        textoConsentimento: { type: string, description: 'o texto da caixa de marketing do cadastro' }
        politica: { type: string, description: 'texto corrido em Markdown (rascunho técnico, não é parecer jurídico)' }
        atualizadaEm: { type: string, format: date-time }
    AlcancePainel:
      type: object
      required: [periodo, total, semRegiao, cidades]
      properties:
        periodo:
          type: object
          required: [de, ate]
          properties:
            de: { type: string, format: date }
            ate: { type: string, format: date }
        total: { type: integer, description: 'atendimentos CONFIRMADO e CONCLUIDO no período (inclui os sem região)' }
        semRegiao: { type: integer, description: 'atendimentos cuja região não se conhece' }
        cidades:
          type: array
          description: 'por volume; "Outras cidades" (uf nula) por último'
          items:
            type: object
            required: [cidade, uf, atendimentos, percentual, abaixoDoLimite, bairros]
            properties:
              cidade: { type: string, example: Osasco }
              uf: { type: [string, 'null'], example: SP }
              atendimentos: { type: [integer, 'null'], description: 'nulo quando abaixoDoLimite' }
              percentual: { type: [number, 'null'], format: double, description: 'sobre o total do período, 1 casa decimal; nulo quando abaixoDoLimite', example: 66.7 }
              abaixoDoLimite: { type: boolean, description: 'verdadeiro só em "Outras cidades" com menos de 5 atendimentos (D114)' }
              bairros:
                type: array
                description: 'por volume; "Outros bairros" por último; vazio em "Outras cidades"'
                items:
                  type: object
                  required: [bairro, atendimentos, percentual, abaixoDoLimite]
                  properties:
                    bairro: { type: string, example: Centro }
                    atendimentos: { type: [integer, 'null'], description: 'nulo quando abaixoDoLimite' }
                    percentual: { type: [number, 'null'], format: double, example: 66.7 }
                    abaixoDoLimite: { type: boolean, description: 'verdadeiro só em "Outros bairros" com menos de 5 atendimentos (D114)' }
    AlcancePublico:
      type: object
      required: [atualizadoEm, totalCidades, totalBairros, regioes]
      properties:
        atualizadoEm: { type: string, format: date-time, description: 'quando o resultado em cache foi calculado' }
        totalCidades: { type: integer }
        totalBairros: { type: integer }
        regioes:
          type: array
          description: 'por volume, sem os números'
          items:
            type: object
            required: [cidade, uf, bairros]
            properties:
              cidade: { type: string, example: Osasco }
              uf: { type: string, example: SP }
              bairros:
                type: array
                items: { type: string, example: Centro }
    PaginaAuditoria:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              atorId: { type: string, format: uuid }
              acao: { type: string }
              recurso: { type: string }
              recursoId: { type: [string, 'null'], format: uuid }
              detalhe: { type: [object, 'null'], description: 'campos técnicos (de/para do status, ids); nunca motivo, nome, WhatsApp, e-mail ou token', additionalProperties: { type: string } }
              ocorridoEm: { type: string, format: date-time }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
