  /admin/agenda:
    get:
      tags: [admin]
      operationId: agendaAdmin
      summary: Agenda do dia ou da semana (BARBEIRO só a própria, H9)
      description: |
        Dia civil no fuso da barbearia; a semana vai de segunda a domingo. Não traz reservas EXPIRADO nem
        AGUARDANDO_PAGAMENTO já vencidas (não ocupam horário, R15). Ordem: início, depois id. Sem paginação.
        Barbeiro inexistente, alheio ou conta BARBEIRO sem vínculo: 404.
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, format: date } }
        - { name: visao, in: query, required: false, schema: { type: string, enum: [DIA, SEMANA], default: DIA } }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Agenda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/agenda/mes:
    get:
      tags: [admin]
      operationId: agendaDoMes
      summary: Calendário do mês com a contagem de reservas por dia (1.11.0, 14C)
      description: |
        Um item por dia do mês, em ordem (28 a 31). `reservas` conta CONFIRMADO, CONCLUIDO, NAO_COMPARECEU e
        AGUARDANDO_PAGAMENTO ainda no prazo (inclusive a reserva manual); fora ficam EXPIRADO, CANCELADO e a aguardando
        vencida (E14). O dia é o dia civil no fuso da barbearia, nunca o UTC. `folga` = alguma folga cobre parte do dia;
        `expediente` = a jornada tem intervalo neste dia da semana. ADMIN vê todos os barbeiros ou o filtrado; BARBEIRO
        vê só o próprio (o escopo vem do `sub` do token; `barbeiroId` só filtra o que o ADMIN pode ver). Barbeiro
        inexistente, alheio ou conta BARBEIRO sem vínculo: `404` (R23). Uma consulta de reservas, uma de folgas e uma de
        jornadas, qualquer que seja o número de barbeiros (E16). `Cache-Control: no-store`.
      parameters:
        - { name: mes, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-12' } }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resumo do mês
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoDoMes' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/agenda/dia:
    get:
      tags: [admin]
      operationId: gradeDoDia
      summary: Grade do dia por horário, com LIVRE, OCUPADO, ALMOCO e FOLGA (1.11.0, 14C)
      description: |
        Uma coluna por barbeiro visível, na ordem do nome. `horarios` vai do primeiro início ao último fim da jornada do
        barbeiro naquele dia da semana, de `granularidadeMin` em `granularidadeMin`; dia sem jornada: `horarios` vazio.
        Prioridade da situação: OCUPADO > FOLGA > ALMOCO > LIVRE (E15). `agendamentos` traz as reservas que ocupam
        (as mesmas do E14), inclusive uma fora da jornada. Mesmo escopo e mesmos erros de `/admin/agenda/mes`; `data`
        fora do formato ISO ou inexistente (ex.: 2026-02-30) é `400`. `Cache-Control: no-store`.
      parameters:
        - { name: data, in: query, required: true, schema: { type: string, format: date, example: '2026-12-01' } }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Grade do dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GradeDoDia' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/agendamentos:
    post:
      tags: [admin]
      operationId: criarReservaManual
      summary: Trava um horário combinado por WhatsApp, fora do app (reserva manual)
      description: |
        ADMIN para qualquer barbeiro; BARBEIRO só para si (barbeiro alheio, inexistente ou conta sem vínculo: 404).
        A reserva nasce `CONFIRMADO`, com `origem = MANUAL`, sem cobrança, sem aceite de política e sem prazo. Respeita
        jornada, almoço, folga, granularidade e serviço ativo; desde a 1.11.0 (D197) não há antecedência mínima nem horizonte, e um
        horário que já passou (início até agora, inclusive) é `422 ANTECEDENCIA_INSUFICIENTE`. Horário ocupado (inclusive por corrida): `409
        HORARIO_INDISPONIVEL`. Grava auditoria na mesma transação. Pode ser concluída ou marcada como falta por
        `PATCH /admin/agendamentos/{id}/status`; só o ADMIN cancela (sem cobrança, nada vai para devolução). Não guarda
        WhatsApp, e-mail nem CPF do cliente; `nomeCliente` e `observacao` são anonimizados 90 dias depois do fim da
        reserva. Pagamento por fora (dinheiro, Pix direto) não gera registro financeiro. Não conta no alcance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaManualRequest' }
      responses:
        '201':
          description: Horário travado
          headers:
            Location: { schema: { type: string }, description: '/admin/agendamentos/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/agendamentos/{id}/status:
    patch:
      tags: [admin]
      operationId: mudarStatusAgendamento
      summary: Conclui, marca falta (NAO_COMPARECEU, valor retido) ou cancela pela barbearia
      description: |
        CONCLUIDO e NAO_COMPARECEU: ADMIN ou BARBEIRO (só da própria agenda), a partir do horário de início.
        CANCELADO: só ADMIN (BARBEIRO recebe 403), com `motivo`; a cobrança paga vira DEVOLUCAO_PENDENTE e a
        pendente vira CANCELADA. Ordem das checagens: 404, 403, 422 MOTIVO_OBRIGATORIO, 409 CONFLITO_DE_VERSAO e
        422 TRANSICAO_INVALIDA (máquina de estados e "antes do início").
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MudancaStatusRequest' }
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendamentoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/minha-jornada:
    get:
      tags: [admin]
      operationId: minhaJornada
      summary: A jornada semanal do barbeiro ligado à conta de quem chama (1.7.0)
      description: |
        ADMIN ou BARBEIRO. O barbeiro vem do `sub` do token (não há id na URL: ninguém lê a jornada de outro). É o que
        a agenda do BARBEIRO usa para listrar o almoço, já que ele não lê `GET /admin/barbeiros` (só ADMIN). Conta sem
        barbeiro ligado (inclusive um ADMIN sem vínculo): 404. Só leitura; quem edita a jornada é o ADMIN. Nunca em cache.
      responses:
        '200':
          description: O barbeiro da conta e os intervalos de trabalho da semana (`intervalos` vazio se não há expediente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MinhaJornada' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/servicos:
    get:
      tags: [admin]
      operationId: listarServicosAdmin
      summary: Lista serviços, inclusive inativos
      description: |
        Só ADMIN. Inclui `ativo` e `version`. O serviço nunca é apagado: sai de cena com `ativo = false` e some de `GET /servicos`.
      responses:
        '200':
          description: Serviços (inclusive inativos)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServicoAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    post:
      tags: [admin]
      operationId: criarServico
      summary: Cria serviço
      description: |
        Só ADMIN. Preço de 1 centavo para cima, duração de 5 a 480 min. Nome único sem diferença de maiúsculas
        (`409 NOME_JA_EXISTE`, inclusive na corrida de dois pedidos). Campo fora do contrato (`id`, `ativo`) é `400 CAMPO_DESCONHECIDO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { schema: { type: string }, description: '/admin/servicos/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/servicos/{id}:
    put:
      tags: [admin]
      operationId: alterarServico
      summary: Altera nome, duração, preço ou ativo
      description: |
        Só ADMIN. Substitui os campos e exige a `version` que a tela viu (`409 CONFLITO_DE_VERSAO` se mudou).
        Preço e duração novos valem só para as reservas novas: reserva e cobrança antigas não são reescritas.
        Desativar não cancela reserva futura.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicoUpdateRequest' }
      responses:
        '200':
          description: Alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicoAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros:
    get:
      tags: [admin]
      operationId: listarBarbeirosAdmin
      summary: Lista barbeiros
      responses:
        '200':
          description: Barbeiros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    post:
      tags: [admin]
      operationId: criarBarbeiro
      summary: Cria barbeiro
      description: |
        Só ADMIN. `usuarioId`, se vier, é de uma conta ativa com o papel BARBEIRO (senão `400` no campo `usuarioId`) e
        que ainda não é de outro barbeiro (`409 USUARIO_JA_VINCULADO`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarbeiroRequest' }
      responses:
        '201':
          description: Criado
          headers:
            Location: { schema: { type: string }, description: '/admin/barbeiros/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros/{id}:
    put:
      tags: [admin]
      operationId: alterarBarbeiro
      summary: Altera nome, WhatsApp, ativo ou login vinculado
      description: |
        Só ADMIN. Substitui os campos (sem `usuarioId` o barbeiro fica sem conta; sem `whatsapp`, sem número) e exige a `version` que a tela viu.
        Inativar tira o barbeiro de `GET /barbeiros` e da disponibilidade, mas não cancela reserva futura.
        A conta ligada passa a ver a própria agenda em `GET /admin/agenda`.

        **Inativar é o desligamento (ADR 0013, H31, H33): tira o acesso e mantém o histórico, não apaga nada.** O papel BARBEIRO sai
        da conta e o token antigo para de valer na hora; o convite pendente é revogado e o WhatsApp comercial some. Se a conta é
        também de cliente (ou do dono), ela continua ativa com os dados e as reservas. Se era só de equipe, é desativada e anonimizada
        (sem senha, sessão ou identidade social; nome e e-mail viram uma lápide). As reservas e a auditoria continuam apontando para o
        mesmo id. Reativar (`ativo: true`) sozinho não devolve o acesso (`acesso = DESLIGADO`): só um convite novo.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BarbeiroUpdateRequest' }
      responses:
        '200':
          description: Alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarbeiroAdmin' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/barbeiros/{id}/convite:
    post:
      tags: [admin]
      operationId: gerarConviteDoBarbeiro
      summary: 'Gera o convite de uso único do barbeiro (reenvia também: o anterior é revogado)'
      description: |
        Só ADMIN (o dono). **Sem corpo**: o dono não informa e-mail nenhum; o barbeiro digita o próprio ao aceitar (D-1). A resposta
        traz o `codigo` **uma vez**, para montar o link `/convite#<codigo>` e o QR; o banco guarda só o SHA-256 e o código nunca
        volta (nem em lista, nem em log, nem na auditoria). Vale por 48 horas (`app.conta.convite.validade`, de 1 hora a 7 dias).
        Emitir de novo revoga o convite pendente e devolve um código novo. O barbeiro que já tem acesso ativo é
        `409 USUARIO_JA_VINCULADO`. Com a senha inicial ainda em uso: `403 TROCA_DE_SENHA_OBRIGATORIA`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '201':
          description: Convite gerado
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConviteEmitido' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '409': { $ref: '#/components/responses/Erro409' }
    delete:
      tags: [admin]
      operationId: revogarConviteDoBarbeiro
      summary: Revoga o convite pendente do barbeiro
      description: "Só ADMIN. Idempotente: sem convite pendente também responde `204`."
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204':
          description: Revogado (ou já não havia convite)
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/barbeiros/{id}/jornada:
    put:
      tags: [admin]
      operationId: substituirJornada
      summary: Substitui a jornada semanal
      description: |
        Só ADMIN. Substitui a semana inteira numa transação; no máximo 28 intervalos; lista vazia é válida (sem expediente).
        Dois intervalos do mesmo dia que se sobrepõem são `422 JORNADA_SOBREPOSTA`; encostar (12:00 e 12:00) não é sobrepor.
        Hora inválida (`25:00`), fim antes do início ou dia fora de 1 a 7 é `400`. Reservas já feitas fora da nova jornada continuam válidas.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/IntervaloJornada' }
      responses:
        '200':
          description: Jornada substituída
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IntervaloJornada' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/barbeiros/{id}/folgas:
    get:
      tags: [admin]
      operationId: listarFolgas
      summary: Folgas do barbeiro de hoje em diante (sem listar, a tela não sabe o que remover)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Folgas de hoje em diante
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Folga' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
    post:
      tags: [admin]
      operationId: criarFolga
      summary: Cria folga ou férias (tipo FOLGA ou FERIAS)
      description: |
        Só ADMIN. Período meio aberto [inicio, fim): `fim` depois de `inicio` e não toda no passado (`400`); `motivo` até 200 caracteres.
        `tipo` (1.12.0, ADR 0015) é `FOLGA` (padrão) ou `FERIAS`; os dois bloqueiam a agenda do mesmo jeito.
        Com reserva ativa (CONFIRMADO, ou AGUARDANDO_PAGAMENTO com prazo aberto) no período: `422 FOLGA_COM_RESERVAS`, nada
        gravado, e desde a 1.12.0 o corpo traz a extensão `conflitos[]`. Com `manterReservas: true` o período é gravado mesmo
        assim: as reservas **continuam como estão** (nada é cancelado sozinho; cancelar continua sendo uma ação do ADMIN, uma a
        uma), os horários novos no período ficam bloqueados e a resposta lista as mantidas em `reservasMantidas[]`.
        Folga e reserva simultâneas nunca passam juntas: a transação trava a linha do barbeiro. Auditoria `FOLGA_CRIADA` na mesma transação.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolgaRequest' }
      responses:
        '201':
          description: Folga criada (com `reservasMantidas` vazio, ou com as reservas mantidas por `manterReservas`)
          headers:
            Location: { schema: { type: string }, description: '/admin/barbeiros/{id}/folgas/{folgaId}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolgaSalva' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422FolgaComReservas' }
  /admin/barbeiros/{id}/folgas/conflitos:
    get:
      tags: [admin]
      operationId: listarConflitosDaFolga
      summary: Prévia dos agendamentos ativos que um período de folga ou férias atingiria
      description: |
        1.12.0 (ADR 0015). Só ADMIN. Só lê: não grava nem trava nada (quem decide é o `POST` ou o `PUT`, que relê dentro da
        trava). Lista as reservas ativas do barbeiro (CONFIRMADO, ou AGUARDANDO_PAGAMENTO com prazo aberto) que se sobrepõem a
        [inicio, fim), em ordem de início; encostar não é conflito. Lista vazia = sem conflito. Período inválido (`fim` não
        depois de `inicio`, ou todo no passado): `400`. Barbeiro inexistente: `404`. Sem e-mail, CPF, WhatsApp nem observação.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: inicio, in: query, required: true, schema: { type: string, format: date-time }, example: '2026-12-21T00:00:00-03:00' }
        - { name: fim, in: query, required: true, schema: { type: string, format: date-time }, example: '2027-01-03T00:00:00-03:00' }
      responses:
        '200':
          description: Reservas ativas no período (vazio quando não há)
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConflitoDeFolga' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/barbeiros/{id}/folgas/{folgaId}:
    put:
      tags: [admin]
      operationId: alterarFolga
      summary: Edita folga ou férias (substitui início, fim, motivo e tipo)
      description: |
        1.12.0 (ADR 0015). Só ADMIN. Substitui o período inteiro, com as mesmas validações e a mesma trava do `POST`: `fim`
        depois de `inicio` e não todo no passado (`400`); conflito com reserva ativa no período novo é
        `422 FOLGA_COM_RESERVAS` com `conflitos[]`, a folga continua como era; com `manterReservas: true` grava e lista as
        mantidas. Folga de outro barbeiro ou inexistente: `404`. Sem controle de versão (um único dono; a última gravação
        vale). Auditoria `FOLGA_ALTERADA` na mesma transação.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: folgaId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolgaRequest' }
      responses:
        '200':
          description: Folga alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolgaSalva' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422FolgaComReservas' }
    delete:
      tags: [admin]
      operationId: removerFolga
      summary: Remove folga ou férias
      description: "Só ADMIN. Libera os horários (sem trava: remover nunca cria conflito). Folga de outro barbeiro ou inexistente: `404`. Auditoria `FOLGA_REMOVIDA`."
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: folgaId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/pagamentos:
    get:
      tags: [admin]
      operationId: listarPagamentosAdmin
      summary: Cobranças por status, inclusive pagas depois de expirar (pendência administrativa)
      description: |
        Só ADMIN. Sem `status`: as pendências (PAGA_APOS_EXPIRACAO e DEVOLUCAO_PENDENTE), as mais antigas primeiro.
        Com `status`: aquele status, as mais recentes primeiro. `status` desconhecido, `pagina` negativa ou
        `tamanho` fora de 1 a 50: 400.
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/StatusCobranca' } }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de cobranças
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaCobrancas' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/pagamentos/{id}/devolucao:
    post:
      tags: [admin]
      operationId: registrarDevolucao
      summary: Registra devolução manual feita (só cancelamento pela barbearia ou pagamento tardio sem horário)
      description: |
        No beta o estorno é feito fora do app (no Pix de volta do Eduardo); a API só registra. DEVOLUCAO_PENDENTE ou
        PAGA_APOS_EXPIRACAO viram DEVOLVIDA. Repetir a devolução é 422 e não altera a data original.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Devolução registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cobranca' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/pagamentos/eventos:
    get:
      tags: [admin]
      operationId: listarEventosEmRevisao
      summary: Eventos do gateway que esgotaram as tentativas (REVISAO_MANUAL), os mais antigos primeiro
      description: Sem payload e sem dado pessoal. Só ADMIN.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaEventos' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/pagamentos/eventos/{id}/revisao:
    post:
      tags: [admin]
      operationId: marcarEventoRevisado
      summary: Marca o evento como revisado (tira da fila; não reprocessa)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Evento revisado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoWebhookAdmin' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
        '422': { $ref: '#/components/responses/Erro422' }
  /admin/configuracao:
    get:
      tags: [admin]
      operationId: lerConfiguracao
      summary: Lê as regras configuráveis da agenda
      responses:
        '200':
          description: Configuração da agenda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    put:
      tags: [admin]
      operationId: alterarConfiguracao
      summary: Altera as regras configuráveis da agenda
      description: |
        Só ADMIN. Exige a `version` que a tela viu (`409 CONFLITO_DE_VERSAO`). Valores fora dos limites são `400` com o campo em
        `errors[]`; mandar `fuso` é `400 CAMPO_DESCONHECIDO` (só leitura). Vale na próxima requisição e não reescreve reservas existentes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
      responses:
        '200':
          description: Alterada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfiguracaoAgenda' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '409': { $ref: '#/components/responses/Erro409' }
  /admin/auditoria:
    get:
      tags: [admin]
      operationId: listarAuditoria
      summary: Ações do painel (paginado, as mais recentes primeiro)
      description: Só ADMIN. O IP da requisição fica guardado no banco e não sai na API.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de ações auditadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/alcance:
    get:
      tags: [admin]
      operationId: alcanceAdmin
      summary: De onde vêm os clientes, por estado, região ou município (pessoas diferentes, com k = 5)
      description: |
        ADMIN vê todos os barbeiros ou filtra por `barbeiroId`; BARBEIRO vê **sempre só os clientes dele** (o `barbeiroId` da
        query é trocado pelo dele e **nada no corpo denuncia isso**, E15). Conta **pessoas diferentes** (uma pessoa com 5
        atendimentos é 1 cliente) com reserva `CONFIRMADO` ou `CONCLUIDO` no período; a pessoa entra no lugar da reserva mais
        recente com região. A reserva manual não conta (D127). Sem região: `semRegiao`.

        **Nível** (`nivel`, padrão `MUNICIPIO`) escolhe o que aparece nas linhas: `ESTADO` (UF, com as regiões imediatas embaixo),
        `REGIAO` (região imediata do IBGE, com os municípios embaixo) ou `MUNICIPIO` (com os bairros embaixo). **k = 5**
        (`app.alcance.k`, nunca abaixo de 3) vale em cada recorte (barbeiro × período × nível): lugar com menos de 5 pessoas
        **sobe de nível** (bairro → município → região imediata → UF → "Outros estados") em vez de sumir, e o "Outros" que
        também ficar abaixo de 5 sobe junto. Nenhum valor entre 1 e k - 1 aparece como número, percentual, zero ou nulo com
        sentido de contagem: abaixo de k só como `abaixoDoLimite = true` com `clientes` e `percentual` nulos.

        **Contra a subtração**: em cada grupo, o que sobra depois dos filhos nomeados é 0 ou pelo menos k (o menor filho nomeado é
        rebaixado para dentro do "Outros" se preciso); o total só aparece (`totalVisivel`) se o que ficou escondido no topo é 0
        ou pelo menos k; e uma célula de um recorte menor (um barbeiro; uma janela padrão menor) só é publicada se a diferença
        para a mesma célula do recorte maior é 0 ou pelo menos k, senão ela sobe de nível. `de` e `ate` seguem aceitos (D108) mas
        **não têm essa proteção entre janelas**: valem só para quem já os usa (risco residual aceito para o dono autenticado, D-4).
        `percentual` = `clientes` do grupo sobre o total do recorte, 1 casa decimal. Nunca em cache (`Cache-Control: no-store`).
      parameters:
        - { name: nivel, in: query, required: false, schema: { $ref: '#/components/schemas/NivelDoAlcance' }, description: 'o nível das linhas (padrão MUNICIPIO)' }
        - { name: uf, in: query, required: false, schema: { type: string, pattern: '^[A-Za-z]{2}$' }, description: 'restringe a uma UF (sigla)' }
        - { name: periodo, in: query, required: false, schema: { type: string, enum: [ULTIMOS_30_DIAS, ULTIMOS_90_DIAS, ULTIMOS_12_MESES], default: ULTIMOS_30_DIAS }, description: 'as três janelas padrão, que a proteção entre janelas cobre' }
        - { name: de, in: query, required: false, schema: { type: string, format: date }, description: 'primeiro dia de uma janela livre (substitui `periodo`; sem a proteção entre janelas)' }
        - { name: ate, in: query, required: false, schema: { type: string, format: date }, description: 'último dia de uma janela livre (padrão: hoje)' }
        - { name: barbeiroId, in: query, required: false, schema: { type: string, format: uuid }, description: 'só para ADMIN; BARBEIRO é sempre o próprio' }
      responses:
        '200':
          description: Alcance do período
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlcancePainel' }
              examples:
                municipio:
                  summary: "nivel = MUNICIPIO: Osasco com bairros embaixo e o resto subido para a região (exemplo fictício no formato real da resposta)"
                  value: {"periodo": {"de": "2026-10-25", "ate": "2026-11-23"}, "nivel": "MUNICIPIO", "k": 5, "totalVisivel": true, "clientes": 27, "semRegiao": {"clientes": 0, "abaixoDoLimite": false}, "grupos": [{"tipo": "MUNICIPIO", "codigo": "3534401", "nome": "Osasco", "uf": "SP", "clientes": 18, "percentual": 66.7, "abaixoDoLimite": false, "agrupadoEm": null, "filhos": [{"tipo": "BAIRRO", "codigo": "3534401", "nome": "Centro", "clientes": 12, "percentual": 44.4, "abaixoDoLimite": false}, {"tipo": "OUTROS", "codigo": "3534401", "nome": "Outros bairros", "clientes": 6, "percentual": 22.2, "abaixoDoLimite": false}]}, {"tipo": "OUTROS", "codigo": "350001", "nome": "Outros municípios da região imediata de São Paulo", "uf": "SP", "clientes": 9, "percentual": 33.3, "abaixoDoLimite": false, "agrupadoEm": "REGIAO", "filhos": []}], "total": 27, "cidades": []}
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '404': { $ref: '#/components/responses/Erro404' }
  /admin/notificacoes/chave-publica:
    get:
      tags: [admin]
      operationId: chavePublicaDeNotificacao
      summary: A chave pública VAPID, para o navegador criar a inscrição de Web Push
      description: |
        ADMIN ou BARBEIRO. O navegador usa esta chave em `pushManager.subscribe`; **não existe cópia dela no front**, então o par
        nunca fica dessincronizado. Sem o par VAPID configurado (ou com o canal `webpush` desligado) responde só
        `{ "disponivel": false }` e a tela mostra "notificações indisponíveis". A chave **privada** nunca sai da API. Nunca em cache.
      responses:
        '200':
          description: Chave pública, ou indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChavePublicaPush' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/notificacoes/inscricao:
    post:
      tags: [admin]
      operationId: inscreverAparelhoDePush
      summary: Guarda o aparelho do barbeiro para receber o Web Push
      description: |
        ADMIN ou BARBEIRO. O aparelho fica na **conta do token**: nenhum corpo escolhe a conta. Idempotente por `endpoint`. O mesmo
        `endpoint` chegando por outra conta (o mesmo aparelho, outro login) **passa para a conta nova**. No máximo 10 aparelhos por
        conta: o 11º substitui o mais antigo. Só endereços de serviço de push são aceitos, em https (`fcm.googleapis.com`,
        `updates.push.services.mozilla.com`, `*.push.apple.com`, `*.notify.windows.com`): qualquer outro host é
        `400 VALIDACAO_INVALIDA` e **nunca é chamado** (contra SSRF). Os valores enviados nunca voltam nas mensagens de erro.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscricaoPush' }
      responses:
        '204':
          description: Aparelho inscrito
          headers:
            Cache-Control: { schema: { type: string }, example: no-store }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
    delete:
      tags: [admin]
      operationId: removerAparelhoDePush
      summary: Remove o aparelho do barbeiro
      description: |
        ADMIN ou BARBEIRO. O `endpoint` vai no **corpo**, não na URL, para não cair em log de acesso. Endpoint que não é da conta, ou
        que não existe, responde `204` igual e **não apaga nada** (não revela de quem é).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemocaoDeInscricaoPush' }
      responses:
        '204': { description: Aparelho removido (ou nada a remover) }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/notificacoes:
    get:
      tags: [admin]
      operationId: novidadesDoPainel
      summary: 'Novidades: os avisos de horário novo da conta de quem chama'
      description: |
        ADMIN ou BARBEIRO. **Sempre a conta do token**: `usuarioId` ou `barbeiroId` na URL são ignorados, sem sinal. Do aviso mais
        novo ao mais antigo; `limite` de 1 a 50 (padrão 20). Duas consultas ao banco (a página e a contagem), sem polling no front.
        **Sem nome nem WhatsApp do cliente**: só serviço, dia e hora; o nome o barbeiro vê abrindo a agenda. Os avisos valem 30 dias.
        Nunca em cache.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Os avisos e quantos ainda não foram lidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Novidades' }
        '400': { $ref: '#/components/responses/Erro400' }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/notificacoes/marcar-lidas:
    post:
      tags: [admin]
      operationId: marcarNovidadesComoLidas
      summary: Marca como lidos todos os avisos da conta de quem chama
      description: ADMIN ou BARBEIRO. Sem corpo. Só os avisos da conta do token.
      responses:
        '204': { description: Avisos marcados como lidos }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
  /admin/notificacoes/teste:
    post:
      tags: [admin]
      operationId: enviarNotificacaoDeTeste
      summary: Manda um aviso de teste aos aparelhos da conta de quem chama
      description: |
        ADMIN ou BARBEIRO. Entrega "Notificações ativadas neste aparelho" **só** aos aparelhos da conta do token; serve para conferir
        o iPhone sem esperar um cliente real. Limite de 5 por hora por conta (`429 LIMITE_EXCEDIDO` com `Retry-After`).
      responses:
        '204': { description: Aviso de teste enviado (ou nenhum aparelho inscrito) }
        '401': { $ref: '#/components/responses/Erro401' }
        '403': { $ref: '#/components/responses/Erro403' }
        '429': { $ref: '#/components/responses/Erro429' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
      description: Token devolvido uma única vez na criação da reserva do guest
    webhookAsaas:
      type: apiKey
      in: header
      name: asaas-access-token
      description: Token configurado no webhook do Asaas (variável GATEWAY_SEGREDO_WEBHOOK)
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyProrrogacao:
      name: X-Idempotency-Key
      in: header
      required: false
      description: |
        1.12.0 (ADR 0015). Opcional, mesmo nome do cabeçalho da cobrança. Repetir o último pedido de mais tempo com a mesma
        chave devolve `200` com o mesmo corpo, sem somar nem contar. Uma chave nova (ou nenhuma) é um pedido novo.
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  responses:
    Erro400:
      description: "Pedido inválido: campo faltando ou com formato errado. `errors[]` diz qual campo e por quê."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            validacaoInvalida:
              summary: "Campos obrigatórios faltando (POST /agendamentos/guest)"
              value: {"detail": "Um ou mais campos estão inválidos.", "instance": "/agendamentos/guest", "status": 400, "title": "Dados inválidos", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#validacao_invalida", "code": "VALIDACAO_INVALIDA", "traceId": "181d75b340244392b54f2346e0ee2feb", "errors": [{"field": "barbeiroId", "message": "obrigatório"}, {"field": "email", "message": "obrigatório"}, {"field": "nome", "message": "obrigatório"}, {"field": "whatsapp", "message": "obrigatório"}]}
            cpfInvalido:
              summary: "CPF com dígito verificador errado (POST /pagamentos/cobrancas)"
              value: {"detail": "O CPF informado não é válido.", "instance": "/pagamentos/cobrancas", "status": 400, "title": "CPF inválido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cpf_invalido", "code": "CPF_INVALIDO", "traceId": "2c0693c76ab34adfae4b9399113f24ba", "errors": []}
            cepInvalido:
              summary: "CEP fora do formato (GET /cep/123)"
              value: {"detail": "O CEP deve ter 8 dígitos.", "instance": "/cep/123", "status": 400, "title": "CEP inválido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#cep_invalido", "code": "CEP_INVALIDO", "traceId": "3b7cc30a9d50453c8b719ea2d390c308", "errors": []}
    Erro401:
      description: "Não autenticado: sem token, token vencido ou credenciais erradas."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoAutenticado:
              summary: "Rota protegida chamada sem token (GET /me)"
              value: {"detail": "Faça login para continuar.", "instance": "/me", "status": 401, "title": "Não autenticado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#nao_autenticado", "code": "NAO_AUTENTICADO", "traceId": "5ea662f2dc9149d9a0d59415a8898671", "errors": []}
            credenciaisInvalidas:
              summary: "Login com e-mail ou senha errados"
              value: {"detail": "E-mail ou senha inválidos.", "instance": "/auth/login", "status": 401, "title": "Credenciais inválidas", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#credenciais_invalidas", "code": "CREDENCIAIS_INVALIDAS", "traceId": "fbd5469059494434a20b33d2b9006235", "errors": []}
    Erro403:
      description: "Sem permissão: o papel de quem chama não pode usar esta rota."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            acessoNegado:
              summary: "CLIENTE tentando abrir o painel (GET /admin/agenda)"
              value: {"detail": "Você não tem permissão para esta ação.", "instance": "/admin/agenda", "status": 403, "title": "Acesso negado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#acesso_negado", "code": "ACESSO_NEGADO", "traceId": "16b9141caf824089a605c5cbe899a44a", "errors": []}
    Erro404:
      description: "Não encontrado ou de outro dono. Recurso alheio também responde 404, para não revelar que existe (BOLA, ADR 0005)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "Reserva de visitante com o token errado"
              value: {"detail": "Agendamento não encontrado.", "instance": "/agendamentos/guest/0baf3fc1-4b92-458e-baed-c07646d94692", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "2f051080e00b447abc09e1d5ec863287", "errors": []}
    Erro404Servico:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "servicoId que não existe (GET /disponibilidade ou POST /agendamentos/guest)"
              value: {"detail": "Serviço não encontrado.", "instance": "/disponibilidade", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "7d41c0e2b39a4f6c8e15a2b0d9c3f871", "errors": []}
    Erro404Reserva:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "reservaId que não existe ou é de outro dono (POST /pagamentos/cobrancas)"
              value: {"detail": "Reserva não encontrada.", "instance": "/pagamentos/cobrancas", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "c2e8a95f1b7d4e03a6f4d18b2c9e7a50", "errors": []}
    Erro404Cobranca:
      description: "Não encontrado. Mesmo código e título do Erro404; o `detail` diz o que faltou."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            naoEncontrado:
              summary: "cobrancaId que não existe ou é de outro dono"
              value: {"detail": "Cobrança não encontrada.", "instance": "/pagamentos/simulacao/568ecc7e-3b1a-4c2d-9e8f-0a1b2c3d4e5f/confirmar", "status": 404, "title": "Não encontrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#recurso_nao_encontrado", "code": "RECURSO_NAO_ENCONTRADO", "traceId": "e4b07d2c9a1f4b68b35e0c7d91a2f6e3", "errors": []}
    Erro409:
      description: "Conflito com o estado atual (e-mail repetido, versão antiga, nome repetido)."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            emailJaCadastrado:
              summary: "Cadastro com e-mail que já tem conta"
              value: {"detail": "Já existe uma conta com este e-mail.", "instance": "/auth/cadastro", "status": 409, "title": "E-mail já cadastrado", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#email_ja_cadastrado", "code": "EMAIL_JA_CADASTRADO", "traceId": "49fe5f2a980c4558810d312776968816", "errors": []}
    Erro409Agendamento:
      description: |
        Conflito ao reservar. HORARIO_INDISPONIVEL = horário ocupado (o front esconde o horário).
        CONFLITO_CONCORRENTE = deadlock que persistiu depois do retry interno; o horário pode estar livre,
        o front não o esconde e pode repetir a mesma requisição uma vez (ADR 0003).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            horarioIndisponivel:
              summary: "Outro cliente reservou o mesmo horário antes"
              value:
                type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#horario_indisponivel
                title: Horário indisponível
                status: 409
                detail: Este horário acabou de ser reservado. Escolha outro.
                instance: /agendamentos/guest
                code: HORARIO_INDISPONIVEL
                traceId: e85960c98be6444b99f2a959a6625350
                errors: []
            conflitoConcorrente:
              summary: "Deadlock que persistiu depois do retry interno (o instance é o caminho chamado: /agendamentos/guest ou /agendamentos)"
              value:
                type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#conflito_concorrente
                title: Conflito momentâneo
                status: 409
                detail: Muitas reservas ao mesmo tempo. Tente de novo.
                instance: /agendamentos/guest
                code: CONFLITO_CONCORRENTE
                traceId: 0af7651916cd43dd8448eb211c80319c
                errors: []
    Erro422:
      description: "Regra de negócio: o pedido está bem formado, mas a regra não deixa."
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            horarioQueJaPassou:
              summary: "Data ou horário que já passou (GET /disponibilidade ou POST /agendamentos): a única regra de tempo desde a 1.11.0"
              value: {"detail": "Este horário já passou.", "instance": "/agendamentos", "status": 422, "title": "Horário já passou", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#antecedencia_insuficiente", "code": "ANTECEDENCIA_INSUFICIENTE", "traceId": "a63f7bfb96e54c42a5b75964242a0775", "errors": []}
            prorrogacaoEsgotada:
              summary: "1.12.0: 11º pedido de mais tempo (os 10 já foram usados)"
              value: {"detail": "Esta reserva já usou todos os pedidos de mais tempo.", "instance": "/agendamentos/0baf3fc1-4b92-458e-baed-c07646d94692/prorrogacao", "status": 422, "title": "Prorrogações esgotadas", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#prorrogacao_esgotada", "code": "PRORROGACAO_ESGOTADA", "traceId": "9e2b7c41d0f34a5b8c6d7e8f90a1b2c3", "errors": []}
            foraDaJanelaDeProrrogacao:
              summary: "Pediu mais 1 minuto antes do último minuto (POST /agendamentos/{id}/prorrogacao)"
              value: {"detail": "Só dá para acrescentar tempo no último minuto.", "instance": "/agendamentos/0baf3fc1-4b92-458e-baed-c07646d94692/prorrogacao", "status": 422, "title": "Fora da janela de prorrogação", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#prorrogacao_fora_da_janela", "code": "PRORROGACAO_FORA_DA_JANELA", "traceId": "7c1e0d52b4a94f6c8e2f31a9d05b6c18", "errors": []}
            conviteInvalido:
              summary: "Convite que não vale (POST /auth/convite): inexistente, vencido, usado, revogado ou e-mail que não serve; o corpo é o mesmo nos seis casos"
              value: {"detail": "Este convite não vale mais ou não pode ser usado aqui.", "instance": "/auth/convite", "status": 422, "title": "Convite inválido", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#convite_invalido", "code": "CONVITE_INVALIDO", "traceId": "0f6c1d2e9a4b4c58b7d3a1e5c9f20b64", "errors": []}
            aceiteObrigatorio:
              summary: "Cobrança sem aceitar a política de pagamento"
              value: {"detail": "Aceite a política de pagamento para continuar.", "instance": "/pagamentos/cobrancas", "status": 422, "title": "Aceite da política obrigatório", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#aceite_politica_obrigatorio", "code": "ACEITE_POLITICA_OBRIGATORIO", "traceId": "0131a184037443a48f1f0ddf801f565b", "errors": []}
    Erro422FolgaComReservas:
      description: |
        Regra de negócio. Na folga (1.12.0, ADR 0015): `FOLGA_COM_RESERVAS` traz a extensão `conflitos[]` com as reservas ativas
        do período; nada é gravado. Para gravar mesmo assim, o painel repete com `manterReservas: true`. Corpo com
        `Cache-Control: no-store`; a extensão nunca vai para o log (R30).
      headers:
        Cache-Control: { schema: { type: string }, example: no-store }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          examples:
            folgaComReservas:
              summary: "Férias por cima de uma reserva confirmada (dados fictícios)"
              value: {"detail": "Há reservas no período da folga.", "instance": "/admin/barbeiros/b0000000-0000-4000-8000-000000000001/folgas", "status": 422, "title": "Existem reservas no período", "type": "https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#folga_com_reservas", "code": "FOLGA_COM_RESERVAS", "traceId": "5d0c3f1a9b2e4c7d8e6f1a2b3c4d5e6f", "errors": [], "conflitos": [{"reservaId": "0baf3fc1-4b92-458e-baed-c07646d94692", "inicio": "2026-12-22T15:00:00-03:00", "fim": "2026-12-22T15:30:00-03:00", "servico": {"id": "6f1c2a8e-0000-4000-8000-000000000001", "nome": "Corte"}, "clienteNome": "Cliente Exemplo", "origem": "CLIENTE", "status": "CONFIRMADO"}]}
    Erro429:
      description: Limite de tentativas
      headers:
        Retry-After: { schema: { type: integer }, description: segundos }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Erro503: { description: Serviço externo indisponível, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  schemas:
    Problema:
      type: object
      description: RFC 9457 Problem Details com extensões code, traceId e errors
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/CodigoErro' }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        conflitos:
          type: array
          description: '1.12.0 (ADR 0015): só no `422 FOLGA_COM_RESERVAS`, as reservas ativas que impedem gravar o período'
          items: { $ref: '#/components/schemas/ConflitoDeFolga' }
      example:
        type: https://github.com/k3vinrich4rd/barbearia-altas-horas/blob/main/docs/contrato/contrato-api.md#horario_indisponivel
        title: Horário indisponível
        status: 409
        detail: Este horário acabou de ser reservado. Escolha outro.
        instance: /agendamentos
        code: HORARIO_INDISPONIVEL
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        errors: []
    CodigoErro:
      type: string
      description: |
        `FORA_DO_HORIZONTE` está **deprecated** desde a 1.11.0 (D197): a API não o devolve mais, e o nome fica no enum para o front
        antigo e o texto genérico dele não quebrarem. `ANTECEDENCIA_INSUFICIENTE` continua, agora só para "o horário já passou".
      enum: [VALIDACAO_INVALIDA, JSON_MALFORMADO, CAMPO_DESCONHECIDO, CEP_INVALIDO, CPF_INVALIDO,
             IDEMPOTENCY_KEY_AUSENTE, NAO_AUTENTICADO, CREDENCIAIS_INVALIDAS, REFRESH_INVALIDO,
             REFRESH_REUTILIZADO, WEBHOOK_NAO_AUTENTICADO, ACESSO_NEGADO, RECURSO_NAO_ENCONTRADO,
             TROCA_DE_SENHA_OBRIGATORIA, CEP_NAO_ENCONTRADO, FUNCIONALIDADE_DESLIGADA, METODO_NAO_PERMITIDO, MIDIA_NAO_SUPORTADA, EMAIL_JA_CADASTRADO, HORARIO_INDISPONIVEL,
             CONFLITO_DE_VERSAO, CONFLITO_CONCORRENTE, NOME_JA_EXISTE, FORA_DO_EXPEDIENTE, ANTECEDENCIA_INSUFICIENTE,
             FORA_DO_HORIZONTE, ACEITE_POLITICA_OBRIGATORIO, TRANSICAO_INVALIDA, MOTIVO_OBRIGATORIO,
             PRORROGACAO_FORA_DA_JANELA, PRORROGACAO_ESGOTADA, RESERVA_EXPIRADA, COBRANCA_EM_ANDAMENTO, SERVICO_INATIVO, IDEMPOTENCIA_CONFLITO, JORNADA_SOBREPOSTA,
             FOLGA_COM_RESERVAS, USUARIO_JA_VINCULADO, LIMITE_EXCEDIDO, GATEWAY_INDISPONIVEL, CEP_INDISPONIVEL,
             BANCO_INDISPONIVEL, EXCLUSAO_BLOQUEADA_POR_RESERVA, CONVITE_INVALIDO, ERRO_INTERNO]
    StatusReserva:
      type: string
      enum: [AGUARDANDO_PAGAMENTO, CONFIRMADO, CONCLUIDO, NAO_COMPARECEU, CANCELADO, EXPIRADO]
    StatusCobranca:
      type: string
      enum: [PENDENTE, PAGA, PAGA_APOS_EXPIRACAO, CANCELADA, FALHOU, DEVOLUCAO_PENDENTE, DEVOLVIDA]
    Papel:
      type: string
      enum: [CLIENTE, BARBEIRO, ADMIN]
    Servico:
      type: object
      required: [id, nome, duracaoMin, precoCentavos]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        duracaoMin: { type: integer }
        precoCentavos: { type: integer, format: int64 }
        precoFormatado: { type: string, example: 'R$ 55,00', description: 'espaço normal depois de R$; milhar com ponto' }
    ServicoAdmin:
      allOf:
        - $ref: '#/components/schemas/Servico'
        - type: object
          required: [ativo, version]
          properties:
            descricao: { type: [string, 'null'] }
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    ServicoRequest:
      type: object
      additionalProperties: false
      required: [nome, duracaoMin, precoCentavos]
      properties:
        nome: { type: string, minLength: 2, maxLength: 80 }
        descricao: { type: string, maxLength: 300 }
        duracaoMin: { type: integer, minimum: 5, maximum: 480 }
        precoCentavos: { type: integer, format: int64, minimum: 1, description: 'pelo menos 1 centavo: a reserva exige preço maior que zero' }
    ServicoUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ServicoRequest'
        - type: object
          required: [ativo, version]
          properties:
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    BarbeiroResumo:
      type: object
      required: [id, nomeExibicao]
      properties:
        id: { type: string, format: uuid }
        nomeExibicao: { type: string }
    BarbeiroPublico:
      description: O barbeiro de `GET /barbeiros`, com o WhatsApp comercial (D122).
      allOf:
        - $ref: '#/components/schemas/BarbeiroResumo'
        - type: object
          required: [whatsapp]
          properties:
            whatsapp: { type: [string, 'null'], pattern: '^[0-9]{10,13}$', description: 'só dígitos, com DDD e DDI opcional', example: '5511912345678' }
    BarbeiroAdmin:
      allOf:
        - $ref: '#/components/schemas/BarbeiroPublico'
        - type: object
          required: [ativo, version, acesso]
          properties:
            usuarioId: { type: [string, 'null'], format: uuid }
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
            jornada:
              type: array
              items: { $ref: '#/components/schemas/IntervaloJornada' }
            acesso:
              type: string
              enum: [SEM_CONTA, CONVITE_PENDENTE, ATIVO, DESLIGADO]
              readOnly: true
              description: 'em que pé está o login do barbeiro (só leitura, 1.8.0); o e-mail dele nunca volta aqui'
            conviteExpiraEm: { type: [string, 'null'], format: date-time, readOnly: true, description: 'só quando acesso = CONVITE_PENDENTE' }
    ConviteAceiteRequest:
      type: object
      additionalProperties: false
      required: [codigo, email]
      properties:
        codigo: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: '43 caracteres base64url (32 bytes de SecureRandom), do link /convite#<codigo>' }
        email: { type: string, format: email, maxLength: 254, description: 'o PRÓPRIO e-mail do barbeiro (vira o login)' }
        senha: { type: string, description: 'de 10 a 72 bytes em UTF-8 (a mesma regra do cadastro); só para conta nova: conta que já tem senha não manda' }
    ConviteEmitido:
      type: object
      required: [codigo, expiraEm]
      properties:
        codigo: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'aparece uma vez; o banco guarda só o SHA-256' }
        expiraEm: { type: string, format: date-time }
    BarbeiroRequest:
      type: object
      additionalProperties: false
      required: [nomeExibicao]
      properties:
        nomeExibicao: { type: string, minLength: 2, maxLength: 80 }
        usuarioId: { type: string, format: uuid, description: 'conta ativa com o papel BARBEIRO e ainda sem barbeiro (409 USUARIO_JA_VINCULADO)' }
        whatsapp: { type: string, description: 'opcional; WhatsApp comercial, de 10 a 13 dígitos, com ou sem máscara (a resposta devolve só dígitos)', example: '(11) 91234-5678' }
    BarbeiroUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/BarbeiroRequest'
        - type: object
          required: [ativo, version]
          properties:
            ativo: { type: boolean }
            version: { type: integer, format: int64 }
    MinhaJornada:
      type: object
      required: [barbeiroId, nomeExibicao, intervalos]
      properties:
        barbeiroId: { type: string, format: uuid, description: 'o barbeiro ligado à conta; a reserva manual do BARBEIRO usa este id' }
        nomeExibicao: { type: string }
        intervalos:
          type: array
          items: { $ref: '#/components/schemas/IntervaloJornada' }
    IntervaloJornada:
      type: object
      additionalProperties: false
      required: [diaSemana, horaInicio, horaFim]
      properties:
        diaSemana: { type: integer, minimum: 1, maximum: 7, description: 'ISO-8601: 1 = segunda' }
        horaInicio: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00' }
        horaFim: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '19:00' }
    TipoFolga:
      type: string
      description: '1.12.0 (ADR 0015): só um rótulo para o painel; os dois bloqueiam a agenda do mesmo jeito'
      enum: [FOLGA, FERIAS]
    FolgaRequest:
      type: object
      additionalProperties: false
      required: [inicio, fim]
      properties:
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        motivo: { type: string, maxLength: 200, description: 'pode ser pessoal: nunca vai para log nem auditoria (R30)' }
        tipo:
          $ref: '#/components/schemas/TipoFolga'
          description: '1.12.0: opcional; sem o campo, a API grava `FOLGA` (sem `default` no schema para o cliente gerado não exigir o campo)'
        manterReservas:
          type: boolean
          writeOnly: true
          description: |
            1.12.0 (ADR 0015): opcional; sem o campo, `false`. `true` grava o período mesmo com reservas ativas nele; elas continuam como estão (nada é
            cancelado sozinho) e voltam em `reservasMantidas`. Nunca é guardado.
    Folga:
      type: object
      required: [id, inicio, fim, tipo]
      properties:
        id: { type: string, format: uuid }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        motivo: { type: string, maxLength: 200 }
        tipo: { $ref: '#/components/schemas/TipoFolga' }
        atualizadaEm: { type: [string, 'null'], format: date-time, description: '1.12.0: nulo até a primeira edição' }
    FolgaSalva:
      description: Resposta do `POST` e do `PUT` de folga (1.12.0)
      allOf:
        - $ref: '#/components/schemas/Folga'
        - type: object
          required: [reservasMantidas]
          properties:
            reservasMantidas:
              type: array
              description: 'reservas ativas que ficaram dentro do período por `manterReservas: true`; vazio quando não houve conflito'
              items: { $ref: '#/components/schemas/ConflitoDeFolga' }
    ConflitoDeFolga:
      type: object
      description: |
        1.12.0 (ADR 0015). Reserva ativa (CONFIRMADO, ou AGUARDANDO_PAGAMENTO com prazo aberto) que se sobrepõe a um período
        de folga ou férias. Só para o ADMIN; sem e-mail, CPF, WhatsApp nem observação; nunca vai para o log (R30).
      required: [reservaId, inicio, fim, servico, clienteNome, origem, status]
      properties:
        reservaId: { type: string, format: uuid }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        servico:
          type: object
          required: [id, nome]
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
        clienteNome: { type: string, description: 'nome de exibição; `Sem nome` na reserva manual sem nome ou já anonimizada' }
        origem: { type: string, enum: [CLIENTE, GUEST, MANUAL] }
        status: { type: string, enum: [CONFIRMADO, AGUARDANDO_PAGAMENTO] }
    Disponibilidade:
      type: object
      required: [data, fuso, servicoId, duracaoMin, barbeiros]
      properties:
        data: { type: string, format: date }
        fuso: { type: string, example: America/Sao_Paulo }
        servicoId: { type: string, format: uuid }
        duracaoMin: { type: integer }
        barbeiros:
          type: array
          items:
            type: object
            required: [barbeiroId, nomeExibicao, horarios]
            properties:
              barbeiroId: { type: string, format: uuid }
              nomeExibicao: { type: string }
              horarios:
                type: array
                description: inícios livres em ordem crescente, sempre com segundos e offset; vazio quando não há horário
                items: { type: string, format: date-time, example: '2026-12-01T07:00:00-03:00' }
              expediente: { $ref: '#/components/schemas/ExpedienteDoDia' }
    ExpedienteDoDia:
      type: object
      description: |
        1.12.0 (ADR 0015). O expediente do barbeiro no dia consultado, tirado da jornada semanal e das folgas. Sempre enviado
        desde a 1.12.0 (opcional no schema só para não quebrar quem lê a 1.11.0). Datas com segundos e offset, no fuso da
        barbearia, como `horarios`. Fechado (`aberto: false`): `inicio`, `fim` e `almoco` são `null`. Folga que cobre só
        parte do dia não fecha o dia. Nem o tipo nem o texto do `motivo` da folga aparecem aqui.
      required: [aberto, motivoFechado, inicio, fim, almoco]
      properties:
        aberto: { type: boolean, description: 'false: fora do expediente, ou folga ou férias cobrindo o expediente inteiro do dia' }
        motivoFechado:
          description: |
            `null` quando aberto. `FORA_DO_EXPEDIENTE`: a jornada não tem intervalo neste dia da semana. `FECHADO`: folga ou
            férias cobrem o expediente inteiro; o tipo não é público (só no `/admin`). A tela mostra "Fechado" nos dois.
          oneOf:
            - { type: string, enum: [FORA_DO_EXPEDIENTE, FECHADO] }
            - { type: 'null' }
        inicio: { type: [string, 'null'], format: date-time, description: 'início do primeiro intervalo da jornada no dia' }
        fim: { type: [string, 'null'], format: date-time, description: 'fim do último intervalo da jornada no dia' }
        almoco:
          description: 'o vão entre os dois primeiros intervalos da jornada no dia; `null` com um intervalo só, ou fechado'
          oneOf:
            - type: object
              required: [inicio, fim]
              properties:
                inicio: { type: string, format: date-time }
                fim: { type: string, format: date-time }
            - { type: 'null' }
    Endereco:
      type: object
      required: [cep]
      properties:
        cep: { type: string, pattern: '^[0-9]{8}$' }
        logradouro: { type: [string, 'null'] }
        bairro: { type: [string, 'null'] }
        cidade: { type: [string, 'null'] }
        uf: { type: [string, 'null'] }
        municipioIbge: { type: [string, 'null'], pattern: '^[0-9]{7}$', description: 'código IBGE do município (1.9.0): do provedor ou, sem ele, da tabela embutida pelo nome e UF; nulo quando não se resolve (R31)' }
        fonte: { type: string, enum: [VIACEP, BRASILAPI, CACHE], description: 'quem respondeu; CACHE quando veio da memória da API (7 dias se encontrado, 1 hora se inexistente)' }
    CadastroRequest:
      type: object
      additionalProperties: false
      required: [nome, email, whatsapp, senha]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        whatsapp: { type: string, description: 'aceita máscara; 10 a 13 dígitos depois de sanitizar', example: '(11) 90000-0001' }
        senha: { type: string, minLength: 10, maxLength: 72, writeOnly: true }
        cep: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$', description: 'desde a 1.9.0 só vale com `autorizaRegiao = true`; sem isso é ignorado (nem consultado, nem guardado). Nunca é guardado' }
        aceitaMarketing: { type: boolean, default: false }
        autorizaRegiao: { type: boolean, description: 'padrão false: a caixinha de consentimento de região (nasce desmarcada). Com `true`, `versaoTextoRegiao` precisa ser a vigente' }
        versaoTextoRegiao: { type: string, maxLength: 20, description: 'a versão do texto da caixinha que a pessoa viu (a de `GET /politica-privacidade`); outra versão: `400 VALIDACAO_INVALIDA`' }
    AtualizarPerfilRequest:
      type: object
      additionalProperties: false
      properties:
        cep: { type: string, pattern: '^[0-9]{5}-?[0-9]{3}$', description: 'só vale com `autorizaRegiao = true`; nunca é guardado' }
        autorizaRegiao: { type: boolean, description: 'false ou ausente (ou sem CEP) = retirar a autorização' }
        versaoTextoRegiao: { type: string, maxLength: 20 }
    Perfil:
      type: object
      required: [id, nome, email, papeis]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        papeis:
          type: array
          items: { $ref: '#/components/schemas/Papel' }
        endereco:
          type: object
          properties:
            cep: { type: [string, 'null'], deprecated: true, description: 'sempre nulo desde a 1.9.0 (o CEP não é guardado); sai na próxima major' }
            bairro: { type: [string, 'null'] }
            cidade: { type: [string, 'null'] }
            uf: { type: [string, 'null'] }
            completo: { type: boolean }
        regiaoAutorizada: { type: boolean, description: 'a conta autoriza o uso do bairro e da cidade no alcance (1.9.0)' }
        deveTrocarSenha: { type: boolean, description: 'true enquanto o admin usa a senha inicial; o front leva para a troca' }
    TrocaDeSenhaRequest:
      type: object
      additionalProperties: false
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual: { type: string, writeOnly: true }
        novaSenha: { type: string, writeOnly: true, description: 'de 10 a 72 bytes em UTF-8' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Tokens:
      type: object
      required: [accessToken, tipo, expiraEmSegundos, refreshToken, refreshExpiraEm, usuario]
      properties:
        accessToken: { type: string }
        tipo: { type: string, const: Bearer }
        expiraEmSegundos: { type: integer, example: 900 }
        refreshToken: { type: string, description: 'lido só pelo BFF, que guarda em cookie HttpOnly' }
        refreshExpiraEm: { type: string, format: date-time }
        usuario:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            papeis:
              type: array
              items: { $ref: '#/components/schemas/Papel' }
        deveTrocarSenha: { type: boolean }
    AgendamentoRequest:
      type: object
      additionalProperties: false
      required: [servicoId, barbeiroId, inicio]
      properties:
        servicoId: { type: string, format: uuid }
        barbeiroId: { type: string, format: uuid }
        inicio: { type: string, format: date-time, example: '2026-12-01T10:00:00-03:00' }
    AgendamentoGuestRequest:
      allOf:
        - $ref: '#/components/schemas/AgendamentoRequest'
        - type: object
          required: [nome, email, whatsapp]
          properties:
            nome: { type: string, minLength: 2, maxLength: 120 }
            email: { type: string, format: email }
            whatsapp: { type: string }
            cep:
              type: [string, 'null']
              pattern: '^[0-9]{5}-?[0-9]{3}$'
              example: '01001-000'
              description: |
                Opcional. Formato errado: `400 CEP_INVALIDO`, nada é criado. Desde a 1.9.0 só vale com `autorizaRegiao = true`:
                sem isso é ignorado (nem consultado, nem guardado). CEP inexistente ou provedor de CEP fora **nunca** impedem a
                reserva (R31): ela nasce sem região. **O CEP nunca é guardado**: ficam bairro, município, UF e o código IBGE, e
                a região some junto com o contato do visitante (90 dias) ou antes, se ele a retirar.
            autorizaRegiao: { type: [boolean, 'null'], description: 'padrão false: a caixinha de consentimento de região (1.9.0), desmarcada por padrão' }
            versaoTextoRegiao: { type: [string, 'null'], maxLength: 20, description: 'obrigatória e vigente com `autorizaRegiao = true` (`400 VALIDACAO_INVALIDA`)' }
    Agendamento:
      type: object
      required: [id, status, origem, inicio, fim, precoCentavos]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusReserva' }
        origem: { type: string, enum: [CLIENTE, GUEST, MANUAL], description: 'MANUAL só aparece no painel (reserva travada pela barbearia, 1.6.0)' }
        servico:
          type: object
          properties:
            id: { type: string, format: uuid }
            nome: { type: string }
            duracaoMin: { type: integer }
        barbeiro: { $ref: '#/components/schemas/BarbeiroResumo' }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        precoCentavos: { type: integer, format: int64, description: 'congelado na reserva; é o valor cobrado (100%)' }
        expiraEm: { type: [string, 'null'], format: date-time, description: 'prazo do pagamento (3 min por padrão, R7); nulo depois de CONFIRMADO' }
        motivoCancelamento: { type: [string, 'null'], description: 'só em cancelamento pela barbearia' }
        version: { type: integer, format: int64 }
        regiaoAutorizada: { type: boolean, description: 'só nas respostas do visitante (1.9.0): a reserva guarda a região com a prova do aceite; vira false depois de `DELETE /agendamentos/guest/{id}/regiao`' }
        prorrogacao:
          description: |
            Acrescentar tempo para pagar (1.11.0, D188; 1.12.0, ADR 0015: 120 s por pedido, até 10). Nulo quando não se
            aplica: reserva manual ou reserva que não está AGUARDANDO_PAGAMENTO dentro do prazo. Com os pedidos esgotados o
            objeto continua presente, com `restantes: 0`.
          oneOf:
            - type: 'null'
            - type: object
              required: [usada, segundos, abreEm, fechaEm]
              properties:
                usada: { type: boolean, deprecated: true, description: 'deprecated na 1.12.0: `true` quando `usadas > 0`. Use `usadas` e `restantes`' }
                usadas: { type: integer, minimum: 0, example: 0, description: '1.12.0: quantos pedidos de mais tempo esta reserva já usou' }
                maximo: { type: integer, minimum: 1, example: 10, description: '1.12.0: quantos pedidos a reserva pode fazer (propriedade `app.agenda.prorrogacao-maximo`, 10)' }
                restantes: { type: integer, minimum: 0, example: 10, description: '1.12.0: `maximo - usadas`; com 0 o botão some' }
                segundos: { type: integer, example: 120, description: 'quanto cada pedido acrescenta (120 desde a 1.12.0, propriedade `app.agenda.prorrogacao-pagamento`; era 60, D190 revogada)' }
                abreEm: { type: string, format: date-time, description: 'início do último minuto (expiraEm - 60 s)' }
                fechaEm: { type: string, format: date-time, description: 'fim da janela, exclusivo: o próprio expiraEm' }
    AgendamentoAdmin:
      description: |
        O Agendamento visto pelo painel: mais o contato de quem vem (nome e WhatsApp, nunca e-mail nem CPF) e o status
        da cobrança (nulo quando a reserva não tem cobrança).
      allOf:
        - $ref: '#/components/schemas/Agendamento'
        - type: object
          required: [cliente]
          properties:
            observacao: { type: [string, 'null'], description: 'só na reserva manual; dado pessoal em potencial, anonimizado em 90 dias' }
            cliente:
              type: object
              required: [nome]
              properties:
                nome: { type: string, description: 'na reserva manual sem nome informado (ou já anonimizada): `Sem nome`' }
                whatsapp: { type: [string, 'null'], description: 'só dígitos, com DDD', example: '11988880001' }
            cobrancaStatus:
              oneOf:
                - { $ref: '#/components/schemas/StatusCobranca' }
                - { type: 'null' }
    ResumoDoMes:
      description: Calendário do mês do painel (1.11.0, 14C). Um item por dia, em ordem.
      type: object
      required: [mes, dias]
      properties:
        mes: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-12' }
        dias:
          type: array
          items:
            type: object
            required: [data, reservas, folga, expediente]
            properties:
              data: { type: string, format: date }
              reservas: { type: integer, minimum: 0, description: 'CONFIRMADO, CONCLUIDO, NAO_COMPARECEU e AGUARDANDO_PAGAMENTO ainda no prazo (E14)' }
              folga: { type: boolean, description: 'alguma folga cobre parte do dia' }
              expediente: { type: boolean, description: 'a jornada tem intervalo neste dia da semana' }
    GradeDoDia:
      description: Grade do dia do painel (1.11.0, 14C). Uma coluna por barbeiro visível, na ordem do nome.
      type: object
      required: [data, granularidadeMin, colunas]
      properties:
        data: { type: string, format: date }
        granularidadeMin: { type: integer, example: 30 }
        colunas:
          type: array
          items:
            type: object
            required: [barbeiroId, nomeExibicao, horarios, agendamentos]
            properties:
              barbeiroId: { type: string, format: uuid }
              nomeExibicao: { type: string }
              horarios:
                type: array
                description: do primeiro início ao último fim da jornada do dia, de granularidade em granularidade
                items:
                  type: object
                  required: [inicio, situacao]
                  properties:
                    inicio: { type: string, pattern: '^\d{2}:\d{2}$', example: '09:00', description: 'HH:mm no fuso da barbearia' }
                    situacao: { type: string, enum: [LIVRE, OCUPADO, ALMOCO, FOLGA] }
                    agendamentoId: { type: [string, 'null'], format: uuid, description: 'só em OCUPADO' }
              agendamentos:
                type: array
                items: { $ref: '#/components/schemas/AgendamentoAdmin' }
    AgendamentoGuest:
      allOf:
        - $ref: '#/components/schemas/Agendamento'
        - type: object
          required: [tokenGuest, expiraEm]
          properties:
            tokenGuest: { type: string, description: 'mostrado uma única vez; o banco guarda só o hash. A API sempre devolve o campo; o BFF grava o token num cookie HttpOnly e o tira do corpo antes de responder ao navegador (D150)' }
    PaginaAgendamentos:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Agendamento' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    ReservaManualRequest:
      type: object
      additionalProperties: false
      required: [servicoId, barbeiroId, inicio]
      properties:
        servicoId: { type: string, format: uuid }
        barbeiroId: { type: string, format: uuid }
        inicio: { type: string, format: date-time }
        nomeCliente: { type: string, maxLength: 80, description: 'opcional; dado pessoal; vazio vira ausente' }
        observacao: { type: string, maxLength: 200, description: 'opcional; não digitar telefone nem documento' }
    MudancaStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status: { type: string, enum: [CONCLUIDO, NAO_COMPARECEU, CANCELADO] }
        motivo: { type: string, maxLength: 300, description: obrigatório quando status = CANCELADO }
        version: { type: integer, format: int64 }
    CobrancaRequest:
      type: object
      additionalProperties: false
      required: [reservaId, metodo, cpf, aceitePolitica, versaoPolitica]
      properties:
        reservaId: { type: string, format: uuid }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        cpf: { type: string, writeOnly: true, description: 'validado, repassado ao gateway e não gravado (ADR 0009)', example: '123.456.789-09' }
        aceitePolitica:
          type: boolean
          const: true
          description: |
            Checkbox obrigatório: "Após o pagamento antecipado de 100%, não há cancelamento,
            remarcação ou estorno em caso de desistência ou falta." Ausente ou false: 422 ACEITE_POLITICA_OBRIGATORIO.
        versaoPolitica: { type: integer, minimum: 1, description: 'versão do texto exibido (GET /politica-pagamento); a API grava versão e data do aceite' }
    Cobranca:
      type: object
      required: [id, reservaId, status, valorCentavos]
      properties:
        id: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusCobranca' }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        valorCentavos: { type: integer, format: int64, description: '100% do precoCentavos da reserva' }
        devolvidaEm: { type: [string, 'null'], format: date-time, description: 'só na resposta de POST /admin/pagamentos/{id}/devolucao e nas cobranças devolvidas' }
        pix:
          type: [object, 'null']
          description: preenchido quando metodo = PIX
          properties:
            copiaECola: { type: string }
            qrCodeBase64:
              type: [string, 'null']
              description: |
                PNG em base64. Nulo no modo simulado do beta (D59, D68): o front gera o QR a partir do copiaECola.
                Também nulo na repetição da criação (200), que não guarda a imagem.
            expiraEm: { type: string, format: date-time, description: 'igual ao expiraEm da reserva' }
        cartao:
          type: [object, 'null']
          description: preenchido quando metodo = CARTAO_CREDITO
          properties:
            urlCheckout: { type: string, format: uri, description: 'checkout hospedado do gateway; a API nunca recebe número de cartão (escopo PCI DSS reduzido)' }
            expiraEm: { type: string, format: date-time }
    CobrancaCriada:
      description: Resposta 201 da criação. Só aqui existe cpfMascarado.
      allOf:
        - $ref: '#/components/schemas/Cobranca'
        - type: object
          required: [cpfMascarado]
          properties:
            cpfMascarado: { type: string, example: '***.***.***-09' }
    MetodoPagamento:
      type: string
      enum: [PIX, CARTAO_CREDITO]
    PoliticaPagamento:
      type: object
      required: [versao, texto]
      properties:
        versao: { type: integer, example: 1 }
        texto:
          type: string
          example: Após o pagamento antecipado de 100%, não há cancelamento, remarcação ou estorno em caso de desistência ou falta.
    PaginaCobrancas:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/CobrancaAdmin' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    CobrancaAdmin:
      description: |
        A Cobranca para o painel: sem `pix` e sem `cartao` (o painel não precisa do copia e cola nem do link) e com o resumo da
        reserva e o contato de quem pagou, para o Eduardo saber para quem fazer o Pix de volta. Nunca CPF nem e-mail.
      type: object
      required: [id, reservaId, status, valorCentavos]
      properties:
        id: { type: string, format: uuid }
        reservaId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusCobranca' }
        metodo: { $ref: '#/components/schemas/MetodoPagamento' }
        valorCentavos: { type: integer, format: int64 }
        criadoEm: { type: string, format: date-time }
        devolvidaEm: { type: [string, 'null'], format: date-time }
        reserva:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            inicio: { type: string, format: date-time }
            servico: { type: string }
            statusReserva: { $ref: '#/components/schemas/StatusReserva' }
            motivoCancelamento: { type: [string, 'null'] }
        contato:
          type: [object, 'null']
          properties:
            nome: { type: string }
            whatsapp: { type: [string, 'null'], example: '11988880001' }
    EventoWebhookAdmin:
      description: Evento do gateway que esgotou as tentativas. Sem payload e sem dado pessoal; `ultimoErro` é só o código do erro.
      type: object
      required: [id, tipo, recebidoEm, tentativas, resultado]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, example: PAYMENT_RECEIVED }
        recebidoEm: { type: string, format: date-time }
        tentativas: { type: integer }
        ultimoErro: { type: [string, 'null'], example: SEM_COBRANCA }
        idCobrancaProvedor: { type: [string, 'null'] }
        resultado: { type: string, enum: [REVISAO_MANUAL, REVISADO] }
        processadoEm: { type: [string, 'null'], format: date-time }
    PaginaEventos:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EventoWebhookAdmin' }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
    WebhookAsaas:
      type: object
      description: Campos que a API lê do evento do Asaas; o resto é ignorado
      required: [id, event]
      properties:
        id: { type: string, example: evt_teste_0001 }
        event: { type: string, example: PAYMENT_RECEIVED }
        payment:
          type: object
          properties:
            id: { type: string }
            billingType: { type: string }
            status: { type: string }
    ConfiguracaoAgenda:
      type: object
      additionalProperties: false
      description: |
        1.11.0 (D197): a antecedência mínima e o horizonte foram revogados e **saem da resposta**. No `PUT` os dois ficam
        opcionais, `deprecated` e **ignorados** (um front antigo que ainda os envia não recebe `400` durante o deploy).
      required: [intervaloEntreAtendimentosMin, granularidadeMin, expiracaoPagamentoMin, version]
      properties:
        fuso: { type: string, readOnly: true, example: America/Sao_Paulo, description: 'só leitura: mandar o campo no PUT é 400 CAMPO_DESCONHECIDO' }
        antecedenciaMinimaMin: { type: integer, minimum: 0, deprecated: true, writeOnly: true, description: 'REVOGADA na 1.11.0 (H5, D197): ignorado no PUT e ausente da resposta' }
        intervaloEntreAtendimentosMin: { type: integer, minimum: 0, maximum: 120, example: 0, description: 'H4: sem intervalo' }
        granularidadeMin: { type: integer, enum: [5, 10, 15, 20, 30, 60], example: 30, description: 'H11: 30 min' }
        horizonteDias: { type: integer, minimum: 1, maximum: 365, deprecated: true, writeOnly: true, description: 'REVOGADO na 1.11.0 (H12, D197): ignorado no PUT e ausente da resposta' }
        expiracaoPagamentoMin: { type: integer, minimum: 3, maximum: 60, example: 3 }
        version: { type: integer, format: int64 }
    Consentimento:
      type: object
      required: [finalidade, aceito, versaoTexto, registradoEm]
      properties:
        finalidade: { type: string, enum: [MARKETING_CEP, REGIAO_ALCANCE] }
        aceito: { type: boolean }
        versaoTexto: { type: string }
        registradoEm: { type: string, format: date-time }
    ConsentimentoRequest:
      type: object
      additionalProperties: false
      required: [aceito, versaoTexto]
      properties:
        aceito: { type: boolean }
        versaoTexto: { type: string, maxLength: 20 }
    ExportacaoDados:
      type: object
      required: [geradoEm, conta, consentimentos, agendamentos]
      properties:
        geradoEm: { type: string, format: date-time }
        conta:
          type: object
          required: [nome, email, whatsapp, endereco]
          properties:
            nome: { type: string }
            email: { type: string, format: email }
            whatsapp: { type: [string, 'null'] }
            regiaoAutorizada: { type: boolean, description: 'a conta autoriza o uso da região no alcance (1.9.0)' }
            endereco:
              type: [object, 'null']
              properties:
                cep: { type: [string, 'null'], deprecated: true, description: 'sempre nulo desde a 1.9.0' }
                municipioIbge: { type: [string, 'null'] }
                bairro: { type: [string, 'null'] }
                cidade: { type: [string, 'null'] }
                uf: { type: [string, 'null'] }
        consentimentos:
          type: array
          description: histórico inteiro, do mais antigo para o mais novo
          items: { $ref: '#/components/schemas/Consentimento' }
        agendamentos:
          type: array
          description: só as reservas em que a conta é o cliente
          items:
            type: object
            required: [id, inicio, fim, status, servico, precoCentavos, motivoCancelamento]
            properties:
              id: { type: string, format: uuid }
              inicio: { type: string, format: date-time }
              fim: { type: string, format: date-time }
              status: { type: string }
              servico: { type: string }
              precoCentavos: { type: integer, format: int64 }
              motivoCancelamento: { type: [string, 'null'] }
    PoliticaPrivacidade:
      type: object
      required: [versao, textoConsentimento, textoConsentimentoRegiao, politica, atualizadaEm]
      properties:
        versao: { type: string, example: '1.2' }
        textoConsentimento: { type: string, description: 'o texto da caixa de marketing do cadastro' }
        textoConsentimentoRegiao: { type: string, description: 'o texto da caixinha de região, desmarcada (1.9.0): cadastro, perfil e checkout do visitante' }
        politica: { type: string, description: 'texto corrido em Markdown (rascunho técnico, não é parecer jurídico)' }
        atualizadaEm: { type: string, format: date-time }
        canalDeContato: { type: string, description: 'o canal de contato sobre os dados (APP_PRIVACIDADE_CONTATO), que aparece ao lado da caixinha de região (1.9.0)' }
    NivelDoAlcance:
      type: string
      enum: [ESTADO, REGIAO, MUNICIPIO]
      description: 'o nível das linhas do painel; cada linha traz o nível de baixo em `filhos`'
    AlcancePainel:
      type: object
      required: [periodo, nivel, k, totalVisivel, clientes, semRegiao, grupos]
      properties:
        periodo:
          type: object
          required: [de, ate]
          properties:
            de: { type: string, format: date }
            ate: { type: string, format: date }
        nivel: { $ref: '#/components/schemas/NivelDoAlcance' }
        k: { type: integer, minimum: 3, example: 5, description: 'o limite de pessoas (app.alcance.k); lugar abaixo dele sobe de nível' }
        totalVisivel:
          type: boolean
          description: 'falso quando a conta fecharia um número menor que k: aí `clientes` (total) e todos os `percentual` vêm nulos'
        clientes: { type: [integer, 'null'], description: 'pessoas diferentes no recorte (inclui as sem região); nulo quando `totalVisivel = false`' }
        semRegiao:
          type: object
          description: 'quem não tem região (não autorizou, revogou ou o CEP não resolveu). Era um número até a 1.8.0; agora é objeto (única exceção da 1.9.0)'
          required: [clientes, abaixoDoLimite]
          properties:
            clientes: { type: [integer, 'null'], description: 'nulo quando `abaixoDoLimite`' }
            abaixoDoLimite: { type: boolean, description: 'verdadeiro quando o número não é publicado (menos de k); a tela escreve "menos de k"' }
        grupos:
          type: array
          description: 'as linhas do nível pedido, por volume; as de tipo `OUTROS` são o que subiu de nível; "Outros estados" por último'
          items: { $ref: '#/components/schemas/AlcanceGrupo' }
        total: { type: [integer, 'null'], deprecated: true, description: 'o mesmo que `clientes`; sai na próxima major' }
        cidades:
          type: array
          deprecated: true
          description: 'o formato antigo (cidade e bairros), só preenchido com `nivel = MUNICIPIO`; sai na próxima major'
          items:
            type: object
            required: [cidade, uf, atendimentos, percentual, abaixoDoLimite, bairros]
            properties:
              cidade: { type: string, example: Osasco }
              uf: { type: [string, 'null'], example: SP }
              atendimentos: { type: [integer, 'null'], description: 'agora conta clientes; nulo quando abaixoDoLimite' }
              percentual: { type: [number, 'null'], format: double }
              abaixoDoLimite: { type: boolean }
              bairros:
                type: array
                items:
                  type: object
                  required: [bairro, atendimentos, percentual, abaixoDoLimite]
                  properties:
                    bairro: { type: string, example: Centro }
                    atendimentos: { type: [integer, 'null'] }
                    percentual: { type: [number, 'null'], format: double }
                    abaixoDoLimite: { type: boolean }
    AlcanceGrupo:
      type: object
      required: [tipo, nome, clientes, percentual, abaixoDoLimite, filhos]
      properties:
        tipo: { type: string, enum: [UF, REGIAO, MUNICIPIO, OUTROS], description: 'o nível da linha, ou OUTROS (o que subiu)' }
        codigo: { type: [string, 'null'], description: 'sigla da UF, código da região imediata ou do município; em OUTROS, o do pai ("Outros bairros" traz o código do município)', example: '3534401' }
        nome: { type: string, example: Osasco }
        uf: { type: [string, 'null'], example: SP }
        clientes: { type: [integer, 'null'], description: 'pessoas diferentes; nulo quando `abaixoDoLimite` (nunca um número entre 1 e k - 1)' }
        percentual: { type: [number, 'null'], format: double, description: 'sobre o total do recorte, 1 casa decimal; nulo quando `abaixoDoLimite` ou `totalVisivel = false`', example: 66.7 }
        abaixoDoLimite: { type: boolean }
        agrupadoEm: { type: [string, 'null'], enum: [REGIAO, UF, PAIS, null], description: 'até que nível um OUTROS subiu; nulo quando ficou no nível pedido' }
        filhos:
          type: array
          description: 'o nível de baixo (UF → regiões, região → municípios, município → bairros), mais um OUTROS com o resto; vazio em OUTROS'
          items: { $ref: '#/components/schemas/AlcanceFilho' }
    AlcanceFilho:
      type: object
      required: [tipo, nome, clientes, percentual, abaixoDoLimite]
      properties:
        tipo: { type: string, enum: [REGIAO, MUNICIPIO, BAIRRO, OUTROS] }
        codigo: { type: [string, 'null'] }
        nome: { type: string, example: Centro }
        clientes: { type: [integer, 'null'] }
        percentual: { type: [number, 'null'], format: double }
        abaixoDoLimite: { type: boolean }
    ChavePublicaPush:
      type: object
      required: [disponivel]
      properties:
        disponivel: { type: boolean, description: 'falso quando o par VAPID não está configurado ou o canal webpush está desligado' }
        chavePublica: { type: string, description: 'a chave pública VAPID em base64url (65 bytes); ausente quando indisponível', example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM }
    InscricaoPush:
      type: object
      description: 'A inscrição como o navegador a entrega (`PushSubscription.toJSON()`). Nada daqui volta em resposta nem vai para log.'
      required: [endpoint, chaves]
      properties:
        endpoint: { type: string, maxLength: 600, description: 'https, só de serviço de push (fcm.googleapis.com, updates.push.services.mozilla.com, *.push.apple.com, *.notify.windows.com)', example: 'https://fcm.googleapis.com/fcm/send/exemplo-de-endpoint' }
        chaves:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200, description: 'chave pública do aparelho, base64url (65 bytes)' }
            auth: { type: string, maxLength: 100, description: 'segredo de autenticação, base64url (16 bytes)' }
    RemocaoDeInscricaoPush:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string, maxLength: 600 }
    Novidades:
      type: object
      required: [naoLidas, itens]
      properties:
        naoLidas: { type: integer, description: 'avisos da conta ainda não lidos (todos, não só os desta página)', example: 2 }
        itens:
          type: array
          items: { $ref: '#/components/schemas/AvisoDoPainel' }
    AvisoDoPainel:
      type: object
      description: 'Um horário novo confirmado pelo pagamento. Sem nome, WhatsApp, e-mail, CPF nem valor do cliente.'
      required: [id, reservaId, servico, inicio, criadoEm, lido]
      properties:
        id: { type: string, format: uuid }
        reservaId: { type: string, format: uuid, description: 'para abrir a agenda do dia' }
        servico: { type: string, description: 'nome do serviço no momento do aviso', example: Corte Degradê }
        inicio: { type: string, format: date-time, description: 'o horário marcado (fuso da barbearia)', example: '2026-11-27T10:00:00-03:00' }
        criadoEm: { type: string, format: date-time }
        lido: { type: boolean }
    AlcancePublico:
      type: object
      required: [atualizadoEm, totalCidades, totalBairros, regioes]
      properties:
        atualizadoEm: { type: string, format: date-time, description: 'quando o resultado em cache foi calculado' }
        totalCidades: { type: integer, description: 'quantos municípios aparecem (conta nomes, não pessoas)' }
        totalBairros: { type: integer, description: 'quantos bairros passam no k (conta nomes, não pessoas)' }
        regioes:
          type: array
          description: 'municípios por volume, sem números de pessoas'
          items:
            type: object
            required: [cidade, uf, codigoIbge, comFaixas, bairros, bairrosComFaixa]
            properties:
              cidade: { type: string, example: Osasco }
              uf: { type: string, example: SP }
              codigoIbge: { type: string, example: '3534401' }
              comFaixas: { type: boolean, description: 'falso em município com menos de 20 pessoas (só nomes)' }
              bairros:
                type: array
                deprecated: true
                description: 'só os nomes (o formato antigo); sai na próxima major'
                items: { type: string, example: Centro }
              bairrosComFaixa:
                type: array
                items:
                  type: object
                  required: [bairro, outros]
                  properties:
                    bairro: { type: string, example: Centro }
                    faixaPercentual: { type: [string, 'null'], example: '15', description: 'a porcentagem sobre o município arredondada para baixo em múltiplos de 5 ("15"), ou "<5"; nulo em município com menos de 20 pessoas e no "Outros bairros"' }
                    outros: { type: boolean, description: 'verdadeiro no "Outros bairros" (só aparece com 5 ou mais, sem faixa)' }
    PaginaAuditoria:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              atorId: { type: string, format: uuid }
              acao: { type: string }
              recurso: { type: string }
              recursoId: { type: [string, 'null'], format: uuid }
              detalhe: { type: [object, 'null'], description: 'campos técnicos (de/para do status, ids); nunca motivo, nome, WhatsApp, e-mail ou token', additionalProperties: { type: string } }
              ocorridoEm: { type: string, format: date-time }
        pagina: { type: integer }
        tamanho: { type: integer }
        total: { type: integer, format: int64 }
