# Só para os testes. Valores fictícios; em produção tudo vem do ambiente.
app.seguranca.jwt.segredo=segredo-so-de-teste-com-mais-de-32-bytes-000000
app.seguranca.bcrypt-custo=4
app.seguranca.cors-origens=https://front.exemplo.test
# Os testes chamam os jobs à mão (o agendamento automático mexeria nos dados de outro teste no meio).
app.jobs.habilitados=false
app.pagamento.idempotencia-segredo=segredo-de-idempotencia-so-de-teste
app.pagamento.webhook-token=token-do-webhook-so-de-teste
# Nenhum teste fala com a internet (A22, D59): as URLs dos provedores de CEP apontam para uma porta fechada. Quem precisa
# de resposta liga o MockRestServiceServer (CepDeTeste); quem esquecer falha na hora, em vez de sair para a rede.
app.cep.viacep-url=http://localhost:1/
app.cep.brasilapi-url=http://localhost:1/
# Canal de contato fictício da política de privacidade (A32): o real vem de APP_PRIVACIDADE_CONTATO e nunca do repositório.
app.privacidade.contato=contato@exemplo.test
