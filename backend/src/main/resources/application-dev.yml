# Perfil dev: PostgreSQL do compose.yaml e seed fictício (db/dev). Nunca em produção.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORTA:5433}/${POSTGRES_BANCO:altashoras}
    username: ${POSTGRES_USUARIO:altashoras}
    password: ${POSTGRES_SENHA:altashoras_dev}
  flyway:
    locations: classpath:db/migration,classpath:db/dev

app:
  seguranca:
    jwt:
      # Só para rodar na sua máquina; em prod o segredo vem obrigatoriamente do ambiente.
      segredo: ${JWT_SEGREDO:somente-desenvolvimento-local-nao-usar-em-producao}
    cors-origens: ${CORS_ORIGENS:http://localhost:3000}
  pagamento:
    # Só para rodar na sua máquina; em prod o segredo vem obrigatoriamente do ambiente.
    idempotencia-segredo: ${IDEMPOTENCIA_HMAC_SEGREDO:somente-desenvolvimento-local-idempotencia}
    webhook-token: ${GATEWAY_SEGREDO_WEBHOOK:token-do-webhook-so-de-desenvolvimento}
