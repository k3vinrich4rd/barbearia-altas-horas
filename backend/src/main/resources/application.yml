# =====================================================================================================================
# Barbearia Altas Horas API · configuração comum a todos os perfis.
# Perfis: dev (docker compose + seed fictício) e prod (variáveis obrigatórias, sem valor padrão).
# Nos testes, o banco vem do Testcontainers (@ServiceConnection), sem perfil.
# =====================================================================================================================
spring:
  application:
    name: altas-horas-api
  # Lê o .env da raiz do repositório quando existe. Os testes apontam ALTAS_HORAS_ENV para um arquivo inexistente.
  config:
    import: optional:file:${ALTAS_HORAS_ENV:../.env}[.properties]
  datasource:
    hikari:
      # Aiven free: max_connections 20 com 3 a 6 reservadas (D12). Nenhuma chamada HTTP dentro de transação.
      maximum-pool-size: 5
  jpa:
    # Quem cria o schema é o Flyway; o Hibernate só confere.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # LocalTime, Instant etc. vão direto para o driver. Sem isto, o fuso UTC acima também é aplicado às
        # colunas "time" (hora local, sem fuso) e a jornada das 07:00 era lida como 04:00 (pego pelo teste A27).
        type:
          java_time_use_direct_jdbc: true
  flyway:
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Campo que o contrato não prevê é erro (400 CAMPO_DESCONHECIDO): ninguém manda "papeis" no cadastro.
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  web:
    resources:
      # API pura: sem arquivos estáticos, rota inexistente vira 404 RECURSO_NAO_ENCONTRADO em problem+json.
      add-mappings: false

app:
  fuso: America/Sao_Paulo
  seguranca:
    jwt:
      # Sem valor padrão de propósito: sem JWT_SEGREDO (32 bytes ou mais) a API não sobe.
      segredo: ${JWT_SEGREDO:}
      validade: 15m
    bcrypt-custo: 12
    # Origens do front, separadas por vírgula. Vazio = nenhuma origem de navegador é aceita.
    cors-origens: ${CORS_ORIGENS:}
  sessao:
    refresh-validade: 7d
  limites:
    login-max: 5
    login-ip-max: 20
    login-janela: 15m
    cadastro-max: 5
    cadastro-janela: 1h
    guest-max: 3          # reservas de visitante por IP (R26, E9)
    guest-janela: 1h
    cep-max: 30           # consultas de CEP por IP (H21, E7)
    cep-janela: 1m
    alcance-max: 30       # consultas da vitrine GET /alcance por IP (E35)
    alcance-janela: 1m
    exportacao-max: 5     # exportações de dados (GET /me/dados) por conta (H22, E14)
    exportacao-janela: 1h
  privacidade:
    # Canal de contato do titular, escrito na política (E13). Vem do ambiente: nunca no repositório (D-4).
    contato: ${APP_PRIVACIDADE_CONTATO:}
    # Prazos de retenção (H13, pendentes de validação jurídica): o job RetencaoDeDados roda às 3h (E18).
    retencao-guest-dias: 90     # contato do visitante, contado do fim da reserva (R29)
    retencao-ip-dias: 365       # IP da auditoria do painel (D77)
    retencao-webhook-dias: 365  # eventos de webhook já processados (ADR 0009)
  cep:
    # ViaCEP primeiro, BrasilAPI de fallback; sem chave e sem conta (D59, ADR 0008).
    viacep-url: https://viacep.com.br
    brasilapi-url: https://brasilapi.com.br
    conexao-timeout: 1s
    leitura-timeout: 2s
    cache-encontrado-ttl: 7d
    cache-inexistente-ttl: 1h
    cache-max: 10000
  pagamento:
    # simulado (padrão em todo o beta, D59): sem conta externa e sem dinheiro real; asaas só na produção.
    modo: simulado
    # Segredo do HMAC da idempotência (R10): obrigatório, a API não sobe sem ele.
    idempotencia-segredo: ${IDEMPOTENCIA_HMAC_SEGREDO:}
    # Token do webhook (cabeçalho asaas-access-token). Vazio = o webhook responde sempre 401.
    webhook-token: ${GATEWAY_SEGREDO_WEBHOOK:}
    # Para onde o link de checkout simulado leva (a tela de pagamento simulado do front).
    url-checkout-simulado: ${URL_CHECKOUT_SIMULADO:http://localhost:3000/pagamento-simulado}
    asaas:
      url: ${GATEWAY_URL:https://api-sandbox.asaas.com/v3}
      token: ${GATEWAY_TOKEN:}
  admin:
    # Primeiro admin: criado na subida só se ainda não existir nenhum (R25). Nunca commitar valores.
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
    nome: ${ADMIN_NOME:Administrador}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Fatia 8B (E7): /actuator/health/liveness (o processo vive; o Render usa este) e /readiness (pronta para atender).
      probes:
        enabled: true

server:
  # Fatia 8B (E11): um deploy no meio de uma reserva deixa a requisição em curso terminar (SIGTERM do Render).
  shutdown: graceful

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
