name: Segurança

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # build-mode none: o CodeQL lê o código-fonte sem compilar.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  gitleaks:
    name: gitleaks (segredos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No PR, só os commits novos; no push, o histórico inteiro. --redact: o valor achado nunca vai para o log.
      - name: Varrer segredos
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          faixa=""
          if [ -n "$BASE" ]; then faixa="--log-opts=$BASE..$HEAD"; fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo $faixa --config /repo/.gitleaks.toml --redact --no-banner --verbose --exit-code 1
