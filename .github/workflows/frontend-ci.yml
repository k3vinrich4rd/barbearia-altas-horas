name: Frontend CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    name: Lint, tipos, testes, build e E2E (Node 22 + API real + PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Admin e limites SÓ de teste do CI (nunca valores reais). Limites elevados por variável de ambiente (E24),
      # sem tocar no código de produção: o E2E reserva e cadastra mais vezes por hora do que o perfil dev permite.
      ADMIN_EMAIL: admin-ci@exemplo.test
      ADMIN_SENHA: SenhaInicialDoCi-2026
      APP_LIMITES_GUEST_MAX: "10000"
      APP_LIMITES_CADASTRO_MAX: "10000"
      APP_LIMITES_LOGIN_MAX: "10000"
      APP_LIMITES_LOGIN_IP_MAX: "10000"
      APP_LIMITES_CEP_MAX: "10000"
      APP_LIMITES_EXPORTACAO_MAX: "10000"
      NEXT_PUBLIC_PAGAMENTO_SIMULADO: "true"
      API_URL: http://localhost:8080
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (npm ci)
        working-directory: frontend
        run: npm ci

      # O cliente tipado e as rotas permitidas vêm do contrato; o tokens.css vem do design system. Nada disso pode ficar velho.
      - name: Conferir tipos, rotas e tokens gerados (sem diferença)
        working-directory: frontend
        run: |
          npm run gerar:tipos
          npm run gerar:rotas
          node scripts/gerar-tokens.mjs --conferir
          git diff --exit-code -- src/api/schema.d.ts src/api/rotas-permitidas.ts
          npm run verificar:tokens

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Testes unitários com cobertura (Vitest)
        working-directory: frontend
        run: npm run test:cobertura

      - name: Build do Next
        working-directory: frontend
        run: npm run build

      # E2E contra a API REAL, no perfil dev, com o PostgreSQL do compose (D-8).
      - name: Subir o PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Subir a API (perfil dev) em segundo plano
        working-directory: backend
        run: |
          nohup sh mvnw -B -ntp -q -DskipTests spring-boot:run -Dspring-boot.run.profiles=dev > ../api.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then echo "API no ar"; exit 0; fi
            sleep 2
          done
          echo "A API não subiu a tempo"; tail -50 ../api.log; exit 1

      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright + axe)
        working-directory: frontend
        run: npx playwright test

      # Fatia 12, A24: Lighthouse móvel (CPU 4x e Slow 4G simulados) no build de produção, contra a API real que já está
      # no ar. O orçamento (Desempenho ≥ 90, Acessibilidade ≥ 95, LCP ≤ 2,5 s, CLS ≤ 0,1, TBT ≤ 200 ms) está em lighthouserc.json.
      - name: Lighthouse móvel (home e /agendar)
        working-directory: frontend
        run: npx -y @lhci/cli@0.15.1 autorun

      # Eval do SDD: os 62 critérios da fatia 7 (7A e 7B) têm teste com o número dele (só dentro de @DisplayName, test( ou it().
      - name: Conferir spec × testes (fatia 7 inteira)
        run: |
          sh scripts/testar-conferir-spec.sh
          sh scripts/conferir-spec.sh 7 --exigir

      # Fatia 12: os 27 critérios do site mais fluido têm teste com o número deles.
      - name: Conferir spec × testes (fatia 12)
        run: sh scripts/conferir-spec.sh 12 --exigir

      # Fatia 16, F2 (topo, menu, barra fixa e /entrar): A1 a A3, A13, A15, A16 e A24 têm teste com o número deles.
      # Passo à parte, para não disputar a linha --exceto da fatia 16 com os outros PRs da fatia.
      - name: Conferir spec × testes (fatia 16, F2)
        run: sh scripts/conferir-spec.sh 16 --exigir --exceto 4-12,14,17-23,25-28

      # Fatia 16 (fluxo sem repetição): cada PR da fatia tira da lista --exceto os critérios que ele cobre.
      # A18 (galeria de cortes, parada), A19 (revisão manual) e A26 (Lighthouse CI) ficam de fora de propósito.
      # Fatia 16, A20: nenhuma foto de cliente entra no repositório (galeria só por armazenamento externo).
      - name: Sem foto de cliente em docs/assets nem em frontend/public
        working-directory: frontend
        run: npx vitest run src/fotos-no-repositorio.test.ts

      - name: Conferir spec × testes (fatia 16)
        run: sh scripts/conferir-spec.sh 16 --exigir --exceto 1-7,9-19,22-24,26-28

      # Fatia 14, parte 14A (mais 1 minuto no Pix e agenda sem limites): A1 a A27 têm teste com o número deles.
      # 14B, 14C e 14D (A28 a A62) entram nas próximas PRs e ampliam o --ate.
      - name: Conferir spec × testes (fatia 14, parte 14A)
        run: sh scripts/conferir-spec.sh 14 --exigir

      - name: Publicar relatórios (Playwright e cobertura)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-relatorios
          path: |
            frontend/playwright-report
            frontend/coverage
            frontend/test-results
            api.log
          retention-days: 7
          if-no-files-found: ignore
