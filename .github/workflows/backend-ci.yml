name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    name: Build e testes (Java 25 + PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testes de integração sobem o PostgreSQL 18 com Testcontainers (o runner ubuntu já tem Docker).
      - name: Compilar, testar e gerar cobertura (JaCoCo)
        run: sh mvnw -B -ntp verify

      # Prova que os testes no PostgreSQL de verdade RODARAM (nenhum pulado).
      - name: Conferir que os testes de banco não foram pulados
        run: |
          for t in ConcorrenciaReservaIT SobreposicaoConstraintIT V1MigracaoIT; do
            f=target/surefire-reports/TEST-io.github.k3vinrich4rd.altashoras.banco.$t.xml
            grep -q 'skipped="0"' "$f" && grep -q 'failures="0"' "$f" && grep -q 'errors="0"' "$f"
          done
          echo "✅ constraint, concorrência e migração rodaram no PostgreSQL 18"

      # Eval do SDD: todo critério de aceite das fatias implementadas tem teste com o número dele.
      - name: Conferir spec × testes
        working-directory: .
        run: |
          for fatia in 1 2 3; do sh scripts/conferir-spec.sh "$fatia" --exigir; done

      # Ferramenta de RAG da documentação: só os testes unitários (o divisor de Markdown), sem banco nem modelo.
      - name: Testar a ferramenta de RAG
        working-directory: ferramentas/rag
        run: sh mvnw -B -ntp -q test

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-backend
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
