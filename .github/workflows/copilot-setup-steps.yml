name: Copilot setup steps

# Prepara o ambiente do agente de código do GitHub Copilot antes de ele começar uma tarefa: JDK 25, dependências
# do Maven já baixadas e a imagem do PostgreSQL dos testes. Sem isto o agente perde tempo (e requisições) tentando
# descobrir como compilar. O nome do job precisa ser exatamente "copilot-setup-steps".
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Baixar dependências e compilar (sem testes)
        working-directory: backend
        run: sh mvnw -B -ntp -q -DskipTests package
      - name: Baixar a imagem do PostgreSQL dos testes
        run: docker pull postgres:18-alpine
