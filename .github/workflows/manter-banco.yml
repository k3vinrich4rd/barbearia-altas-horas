name: Manter banco ligado

# Fatia 8B (E12, D-3): mantém o PostgreSQL free da Aiven ligado com uma conexão direta (select 1), duas vezes por dia, SEM
# acordar a API do Render (custo: 0 h das 750 h). Roda só por agenda ou à mão, NUNCA em pull request: usa o segredo do
# banco. Reaproveita DB_URL_BACKUP (D-6); a URL nunca é impressa.

on:
  schedule:
    - cron: "17 9 * * *"    # 06:17 em Brasília
    - cron: "17 21 * * *"   # 18:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manter-banco
  cancel-in-progress: false

jobs:
  select-1:
    name: select 1 direto no banco
    # Só no repositório original: um fork não tem o segredo nem deve tentar.
    if: github.repository == 'k3vinrich4rd/barbearia-altas-horas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DB_URL_BACKUP: ${{ secrets.DB_URL_BACKUP }}
    steps:
      - name: Conferir que o segredo existe
        run: |
          [ -n "$DB_URL_BACKUP" ] || { echo "::error::Falta o segredo DB_URL_BACKUP (veja docs/planejamento/ativar-deploy.md)"; exit 1; }
          case "$DB_URL_BACKUP" in
            postgres://*@*|postgresql://*@*) ;;
            *) echo "::error::DB_URL_BACKUP em formato errado: use a Service URI do Aiven (postgres://avnadmin:SENHA@HOST:PORTA/defaultdb?sslmode=require), sem aspas, espaço nem o prefixo jdbc:"; exit 1 ;;
          esac

      # psql da versão 18 (a mesma do banco). A URL entra por variável de ambiente e não é impressa.
      - name: select 1
        run: |
          docker run --rm -e DB_URL_BACKUP postgres:18-alpine \
            sh -c 'psql "$DB_URL_BACKUP" -v ON_ERROR_STOP=1 -tAc "select 1"' > resposta.txt 2>/dev/null \
            || { echo "::error::não conectou ao banco (confira se o serviço da Aiven está ligado e o segredo DB_URL_BACKUP)"; exit 1; }
          [ "$(tr -d '[:space:]' < resposta.txt)" = "1" ] || { echo "::error::resposta inesperada do banco"; exit 1; }
          echo "banco respondeu: select 1 = 1"
